<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Preconnect to external origins for faster loading -->
    <link rel="preconnect" href="https://cdn.gpteng.co" crossorigin />
    <link rel="preconnect" href="https://szthqtnbepupjqjxaduu.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.gpteng.co" />
    <link rel="dns-prefetch" href="https://szthqtnbepupjqjxaduu.supabase.co" />
    
    <!-- Preload critical font -->
    <link rel="preload" href="https://cdn.gpteng.co/mcp-widgets/v1/fonts/CameraPlainVariable.woff2" as="font" type="font/woff2" crossorigin />
    
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5, user-scalable=yes" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e6007a" media="(prefers-color-scheme: light)" />
    <meta name="description" content="VYBE - The Next Generation Social Platform. Share moments, connect with friends, and discover amazing content from creators worldwide." />
    <meta name="keywords" content="social media, shorts, videos, memes, creators, community, VYBE, social network" />
    <meta name="author" content="VYBE" />
    <meta name="application-name" content="VYBE" />
    
    <!-- Performance hints -->
    <meta http-equiv="x-dns-prefetch-control" content="on" />
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VYBE - The Next Generation Social Platform" />
    <meta property="og:description" content="Share moments, connect with friends, and discover amazing content from creators worldwide." />
    <meta property="og:site_name" content="VYBE" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta property="og:url" content="https://vybeapp.lovable.app" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VYBE - The Next Generation Social Platform" />
    <meta name="twitter:description" content="Share moments, connect with friends, and discover amazing content from creators worldwide." />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />
    
    <!-- PWA / Mobile App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VYBE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#0a0a0b" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Android specific -->
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="color-scheme" content="dark light" />
    
    <title>VYBE - The Next Generation Social Platform</title>
    
    <!-- Critical inline CSS for faster LCP -->
    <style>
      html, body { margin: 0; padding: 0; min-height: 100vh; background: #0a0a0b; }
      #root { min-height: 100vh; background: #0a0a0b; }
      /* Prevent layout shift */
      img, video { max-width: 100%; height: auto; }
      /* Native app feel */
      body { 
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: contain;
      }
      /* Allow text selection in inputs and text areas */
      input, textarea, [contenteditable="true"] {
        -webkit-user-select: text;
        user-select: text;
      }
      /* Safe area support for notched devices */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* NOTE: Avoid transforms on #root — they break position:fixed (e.g., bottom nav) on some browsers */
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Inline splash skeleton for faster LCP - matches React splash screen -->
      <div id="initial-splash" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0b;gap:24px;position:relative;overflow:hidden;">
        <!-- Background glow -->
        <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 40%, rgba(230,0,122,0.08) 0%, transparent 60%);"></div>
        
        <!-- Logo container with glow -->
        <div style="position:relative;">
          <!-- Spinning ring -->
          <div style="position:absolute;inset:-16px;border:2px solid rgba(230,0,122,0.2);border-top-color:#e6007a;border-radius:50%;animation:spin 2s linear infinite;"></div>
          
          <!-- Logo box -->
          <div style="width:80px;height:80px;border-radius:16px;background:linear-gradient(135deg, #e6007a 0%, #8b5cf6 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px -12px rgba(230,0,122,0.4);">
            <svg viewBox="0 0 32 32" fill="none" style="width:48px;height:48px;">
              <path d="M6 8L16 24L26 8" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M10 6C10 6 12 10 16 10C20 10 22 6 22 6" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
              <circle cx="16" cy="24" r="2" fill="white"/>
            </svg>
          </div>
        </div>
        
        <!-- VYBE text -->
        <div style="font-family:system-ui,-apple-system,sans-serif;font-size:28px;font-weight:900;letter-spacing:-0.02em;background:linear-gradient(135deg, #e6007a 0%, #8b5cf6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">VYBE</div>
        
        <!-- Progress bar -->
        <div style="width:200px;">
          <div style="height:6px;background:rgba(255,255,255,0.1);border-radius:999px;overflow:hidden;">
            <div style="height:100%;width:0%;background:linear-gradient(90deg, #e6007a, #8b5cf6);border-radius:999px;animation:progress 1.2s ease-out forwards;"></div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:rgba(255,255,255,0.4);font-family:system-ui,-apple-system,sans-serif;">
            <span>Loading...</span>
            <span style="font-variant-numeric:tabular-nums;">0%</span>
          </div>
        </div>
        
        <!-- Tagline -->
        <div style="position:absolute;bottom:32px;font-size:11px;color:rgba(255,255,255,0.3);font-family:system-ui,-apple-system,sans-serif;">The Next Generation Social Platform</div>
      </div>
      <style>
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes progress{0%{width:0%}50%{width:60%}100%{width:85%}}
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
