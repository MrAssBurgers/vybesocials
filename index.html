    <!-- VYBE pre-boot theme application — runs BEFORE anything paints so the
         splash screen never flashes default/preset colors before the user's
         saved theme is loaded by React. We mirror every applyThemeTokens()
         call to localStorage('vybe-boot-theme') and replay it here. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          // 1) Mode (dark / light) — set the class before any CSS evaluates
          var mode = localStorage.getItem('xd-theme') || 'dark';
          if (mode === 'system') {
            mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          root.classList.remove('light', 'dark');
          root.classList.add(mode === 'light' ? 'light' : 'dark');

          // 2) Cached token snapshot from last session
          var raw = localStorage.getItem('vybe-boot-theme');
          if (!raw) return;
          var vars = JSON.parse(raw);
          if (!vars || typeof vars !== 'object') return;
          for (var k in vars) {
            if (Object.prototype.hasOwnProperty.call(vars, k) && typeof vars[k] === 'string') {
              root.style.setProperty(k, vars[k]);
            }
          }
        } catch (e) { /* fail open — React will paint defaults */ }
      })();
    </script>

    <!-- Global font-loading guard: forces gradient/transparent text to fall back
         to currentColor until web fonts are ready, eliminating the flash of
         invisible / mis-styled text (FOUT/FOIT) for bg-clip-text utilities.
         The matching CSS lives in src/index.css under html[data-theme-loading]. -->
    <script>
      (function () {
        try {
          document.documentElement.setAttribute('data-theme-loading', 'true');
          var clear = function () {
            document.documentElement.removeAttribute('data-theme-loading');
          };
          if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') {
            document.fonts.ready.then(clear, clear);
            // Hard cap: never block visible text for more than 1.2s.
            setTimeout(clear, 1200);
          } else {
            setTimeout(clear, 400);
          }
        } catch (e) { /* fail open */ }
      })();
    </script>

    <!-- OneSignal Push Notifications -->
    <script>
      (function () {
        const hostname = window.location.hostname;
        const params = new URLSearchParams(window.location.search);
        const ua = (navigator.userAgent || '').toLowerCase();
        // Detect Despia native wrapper (Play/App Store builds) — NOT Capacitor.
        // Web OneSignal SDK is disabled in native shells; Despia uses its own bridge.
        const isNativeWrapper =
          /despia|vybeapp|median|gonative|wv\)|; wv\b/.test(ua) ||
          !!(window).Despia ||
          !!(window).__DESPIA__;
        const isPreviewHost =
          hostname.includes('preview') ||
          hostname.endsWith('.lovableproject.com') ||
          hostname.endsWith('.lovable.app') ||
          params.has('__lovable_token');
        const isAllowedHost = hostname === 'vybehub.app' || hostname === 'www.vybehub.app';

        window.OneSignalDeferred = window.OneSignalDeferred || [];

        if (isNativeWrapper || isPreviewHost || !isAllowedHost) {
          console.info('[VYBE] OneSignal disabled on this host');
          return;
        }


        window.OneSignalDeferred.push(async function (OneSignal) {
          try {
            await OneSignal.init({
              appId: "85bcf4b4-16fb-4101-90b3-59ca9574e57b",
              safari_web_id: "web.onesignal.auto.3cfe9839-ceab-4809-9212-172318dbfb2e",
              notifyButton: {
                enable: false,
              },
            });
          } catch (error) {
            console.warn('[VYBE] OneSignal init failed gracefully:', error);
          }
        });

        const script = document.createElement('script');
        script.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
        script.defer = true;
        script.onerror = function () {
          console.warn('[VYBE] OneSignal SDK failed to load');
        };
        document.head.appendChild(script);
      })();
    </script>

    <!-- Fallback when CDN serves stale hashed index-*.js (Lovable publish mismatch) -->
    <script>
      (function () {
        var STABLE = '/assets/app.js';
        function loadStableEntry() {
          if (window.__VYBE_APP_LOADED__) return;
          if (document.querySelector('script[data-vybe-stable-entry]')) return;
          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = STABLE + '?vybe=' + Date.now();
          s.setAttribute('data-vybe-stable-entry', 'true');
          s.onload = function () { window.__VYBE_APP_LOADED__ = true; };
          document.head.appendChild(s);
        }
        window.addEventListener('error', function (e) {
          var file = e.filename || '';
          if (file.indexOf('/assets/index-') === -1) return;
          loadStableEntry();
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var msg = e.reason instanceof Error ? e.reason.message : String(e.reason || '');
          if (msg.indexOf('Failed to fetch') !== -1 || msg.indexOf('Importing a module script failed') !== -1) {
            loadStableEntry();
          }
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          var hasPaint = root && (root.textContent || '').replace(/\s+/g, '').length > 12;
          if (!window.__VYBE_APP_LOADED__ && !hasPaint) loadStableEntry();
        }, 2000);
      })();
    </script>
