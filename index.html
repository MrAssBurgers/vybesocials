<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Preconnect to external origins for faster loading -->
    <link rel="preconnect" href="https://cdn.gpteng.co" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.gpteng.co" />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="description" content="VYBE - The Next Generation Social Platform. Share moments, connect with friends, and discover amazing content from creators worldwide." />
    <meta name="keywords" content="social media, shorts, videos, memes, creators, community" />
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VYBE - The Next Generation Social Platform" />
    <meta property="og:description" content="Share moments, connect with friends, and discover amazing content from creators worldwide." />
    <meta property="og:site_name" content="VYBE" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VYBE - The Next Generation Social Platform" />
    <meta name="twitter:description" content="Share moments, connect with friends, and discover amazing content from creators worldwide." />
    
    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VYBE" />
    
    <title>VYBE - The Next Generation Social Platform</title>
    
    <!-- Critical inline CSS for faster LCP -->
    <style>
      html, body { margin: 0; padding: 0; min-height: 100vh; background: #0a0a0b; }
      #root { min-height: 100vh; background: #0a0a0b; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Inline skeleton for faster LCP -->
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0b;">
        <div style="width:40px;height:40px;border:3px solid #333;border-top-color:#a855f7;border-radius:50%;animation:spin 1s linear infinite;"></div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
