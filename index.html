<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Preconnect to external origins for faster loading -->
    <link rel="preconnect" href="https://cdn.gpteng.co" crossorigin />
    <link rel="preconnect" href="https://szthqtnbepupjqjxaduu.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.gpteng.co" />
    <link rel="dns-prefetch" href="https://szthqtnbepupjqjxaduu.supabase.co" />
    
    <!-- Defer font loading - not needed for splash screen FCP -->
    <link rel="preload" href="https://cdn.gpteng.co/mcp-widgets/v1/fonts/CameraPlainVariable.woff2" as="font" type="font/woff2" crossorigin fetchpriority="low" />
    
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/vybe-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/vybe-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5, user-scalable=yes" />
    <meta name="theme-color" content="#8B5CF6" />
    <meta name="description" content="VYBE - The Next Generation Social Platform. Share moments, connect with friends, and discover amazing content from creators worldwide." />
    <meta name="keywords" content="social media, shorts, videos, memes, creators, community, VYBE, social network" />
    <meta name="author" content="VYBE" />
    <meta name="application-name" content="VYBE" />
    
    <!-- Performance hints -->
    <meta http-equiv="x-dns-prefetch-control" content="on" />
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VYBE - The Next Generation Social Platform" />
    <meta property="og:description" content="Share moments, connect with friends, and discover amazing content from creators worldwide." />
    <meta property="og:site_name" content="VYBE" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta property="og:url" content="https://vybeapp.lovable.app" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VYBE - The Next Generation Social Platform" />
    <meta name="twitter:description" content="Share moments, connect with friends, and discover amazing content from creators worldwide." />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />
    
    <!-- PWA / Mobile App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VYBE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#0B0B10" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Android specific -->
    <meta name="color-scheme" content="dark light" />
    
    <title>VYBE - The Next Generation Social Platform</title>
    
    <!-- Critical inline CSS for faster LCP -->
    <style>
      html, body { margin: 0; padding: 0; min-height: 100vh; background: #0B0B10; }
      #root { min-height: 100vh; background: #0B0B10; }
      /* Prevent layout shift */
      img, video { max-width: 100%; height: auto; }
      /* Native app feel */
      body { 
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: contain;
      }
      /* Allow text selection in inputs and text areas */
      input, textarea, [contenteditable="true"] {
        -webkit-user-select: text;
        user-select: text;
      }
      /* Safe area support for notched devices */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* NOTE: Avoid transforms on #root — they break position:fixed (e.g., bottom nav) on some browsers */
      
      /* Static splash screen styles for immediate FCP */
      .static-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0B0B10;
        z-index: 9999;
      }
      .static-splash-logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: linear-gradient(135deg, #8B5CF6 0%, #A78BFA 50%, #C4B5FD 100%);
        box-shadow: 0 0 60px rgba(139, 92, 246, 0.4);
        animation: logo-pulse 2s ease-in-out infinite;
      }
      .static-splash-loader {
        margin-top: 32px;
        width: 120px;
        height: 3px;
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
        overflow: hidden;
      }
      .static-splash-loader-bar {
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #8B5CF6, #22D3EE);
        border-radius: 3px;
        animation: loader-slide 1.5s ease-in-out infinite;
      }
      @keyframes logo-pulse {
        0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 60px rgba(139, 92, 246, 0.4); }
        50% { opacity: 0.9; transform: scale(1.02); box-shadow: 0 0 80px rgba(139, 92, 246, 0.6); }
      }
      @keyframes loader-slide {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(150%); }
        100% { transform: translateX(300%); }
      }
    </style>
    
    <!-- Defer non-critical CSS for faster FCP - splash uses inline styles -->
    <script>
      // Immediately mark future stylesheets as non-blocking
      (function(){
        var d=document,o=new MutationObserver(function(m){
          m.forEach(function(x){x.addedNodes.forEach(function(n){
            if(n.tagName==='LINK'&&n.rel==='stylesheet'){
              n.media='print';n.onload=function(){this.media='all';this.onload=null;};
            }
          });});
        });
        o.observe(d.head,{childList:true});
        // Also defer any existing stylesheets added before script ran
        d.querySelectorAll('link[rel="stylesheet"]').forEach(function(l){
          if(!l.dataset.critical){l.media='print';l.onload=function(){this.media='all';};}
        });
        addEventListener('load',function(){o.disconnect();},{once:true});
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static splash for immediate FCP/LCP - replaced by React on hydration -->
      <div class="static-splash" aria-label="Loading VYBE">
        <div class="static-splash-logo"></div>
        <div class="static-splash-loader">
          <div class="static-splash-loader-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
