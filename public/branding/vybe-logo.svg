<?xml version="1.0" encoding="UTF-8"?>
<!--
  Vybe logo  SOURCE OF TRUTH (512�512 viewBox)

  Export from Figma (2 capsules � Boolean Union � corner smooth � export SVG).
  Paste path geometry into each layer below. Never generate paths in app code.

  Layer stack (bottom � top):
    vybe-path-glow-left, vybe-path-glow-right
    vybe-path-arm-left, vybe-path-arm-left-shade
    vybe-path-overlap
    vybe-path-arm-right, vybe-path-arm-right-shade
    vybe-path-highlight-left, vybe-path-highlight-right
    vybe-path-joint-bloom
-->
<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- Gradient 1  left arm body (pink � purple) -->
    <linearGradient id="vybe-gradient-left" x1="105" y1="64" x2="248" y2="378" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--vybe-logo-left, #f80a7c)"/>
      <stop offset="100%" stop-color="var(--vybe-logo-left-deep, #9333ea)"/>
    </linearGradient>
    <!-- Gradient 2  right arm body (blue � cyan) -->
    <linearGradient id="vybe-gradient-right" x1="407" y1="64" x2="264" y2="378" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--vybe-logo-right, #2563eb)"/>
      <stop offset="100%" stop-color="var(--vybe-logo-right-deep, #06c0fb)"/>
    </linearGradient>
    <!-- Gradient 3  left cylindrical shading -->
    <radialGradient id="vybe-gradient-left-shade" cx="42%" cy="38%" r="58%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
    <!-- Gradient 4  right cylindrical shading -->
    <radialGradient id="vybe-gradient-right-shade" cx="58%" cy="38%" r="58%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38"/>
    </radialGradient>
    <!-- Overlap color mix -->
    <radialGradient id="vybe-gradient-overlap" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--vybe-logo-overlap, #6d28d9)" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="var(--vybe-logo-overlap, #6d28d9)" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="var(--vybe-logo-overlap, #6d28d9)" stop-opacity="0"/>
    </radialGradient>
    <!-- Specular highlights -->
    <linearGradient id="vybe-gradient-highlight-left" x1="130" y1="70" x2="250" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vybe-gradient-highlight-right" x1="382" y1="70" x2="262" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Joint bloom -->
    <radialGradient id="vybe-gradient-joint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Blur layer 1  pink ambient -->
    <filter id="vybe-filter-glow-left" x="-90%" y="-90%" width="280%" height="280%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <!-- Blur layer 2  blue ambient -->
    <filter id="vybe-filter-glow-right" x="-90%" y="-90%" width="280%" height="280%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <!-- Blur layer 3  bottom bloom -->
    <filter id="vybe-filter-joint-bloom" x="-150%" y="-150%" width="400%" height="400%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- FIGMA: paste left-arm silhouette for glow -->
  <g id="vybe-layer-glow-left" class="vybe-logo-glow vybe-logo-glow--left" opacity="var(--vybe-logo-glow-opacity, 0.42)">
    <path id="vybe-path-glow-left" fill="var(--vybe-logo-left, #f80a7c)" filter="url(#vybe-filter-glow-left)" d=""/>
  </g>

  <!-- FIGMA: paste right-arm silhouette for glow -->
  <g id="vybe-layer-glow-right" class="vybe-logo-glow vybe-logo-glow--right" opacity="var(--vybe-logo-glow-opacity, 0.42)">
    <path id="vybe-path-glow-right" fill="var(--vybe-logo-right-deep, #06c0fb)" filter="url(#vybe-filter-glow-right)" d=""/>
  </g>

  <!-- FIGMA: paste left arm (under) -->
  <g id="vybe-layer-arm-left" class="vybe-logo-arm vybe-logo-arm--left">
    <path id="vybe-path-arm-left" fill="url(#vybe-gradient-left)" d=""/>
    <path id="vybe-path-arm-left-shade" fill="url(#vybe-gradient-left-shade)" style="mix-blend-mode:soft-light" d=""/>
  </g>

  <!-- FIGMA: paste overlap ellipse or path -->
  <ellipse id="vybe-path-overlap" cx="272" cy="338" rx="52" ry="44" fill="url(#vybe-gradient-overlap)" style="mix-blend-mode:multiply" opacity="0"/>

  <!-- FIGMA: paste right arm (over) -->
  <g id="vybe-layer-arm-right" class="vybe-logo-arm vybe-logo-arm--right">
    <path id="vybe-path-arm-right" fill="url(#vybe-gradient-right)" d=""/>
    <path id="vybe-path-arm-right-shade" fill="url(#vybe-gradient-right-shade)" style="mix-blend-mode:soft-light" d=""/>
  </g>

  <!-- FIGMA: paste inner highlight paths -->
  <path id="vybe-path-highlight-left" fill="url(#vybe-gradient-highlight-left)" opacity="0.42" d=""/>
  <path id="vybe-path-highlight-right" fill="url(#vybe-gradient-highlight-right)" opacity="0.36" d=""/>

  <!-- FIGMA: paste joint bloom circle or path -->
  <circle id="vybe-path-joint-bloom" class="vybe-logo-joint" cx="256" cy="372" r="38" fill="url(#vybe-gradient-joint)" filter="url(#vybe-filter-joint-bloom)" opacity="0.95"/>
</svg>
