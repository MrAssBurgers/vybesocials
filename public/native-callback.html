<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing in…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0B0B10;
      color: #a1a1aa;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      text-align: center;
    }
    #status { margin: 0; }
    #openApp, #webFallback {
      display: none;
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 14px 22px;
      background: #fff;
      color: #0B0B10;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    #webFallback {
      background: transparent;
      color: #a1a1aa;
      border: 1px solid #3f3f46;
    }
  </style>
</head>
<body>
  <p id="status">Completing sign-in…</p>
  <a id="openApp">Open VYBE</a>
  <a id="webFallback" href="https://vybehub.app/auth/callback">Continue on web</a>
  <script>
    (function () {
      var DEFAULT_SCHEME = 'com.despia.vybe';
      var EXCHANGE_URL = 'https://us-central1-vybe-daaab.cloudfunctions.net/authQr';
      var WEB_FALLBACK = 'https://vybehub.app/auth/callback';
      // Soft cap — iOS rejects longer custom-scheme URLs as “address is invalid”.
      var MAX_DEEPLINK_LEN = 1800;

      function setStatus(text) {
        var el = document.getElementById('status');
        if (el) el.textContent = text;
      }

      function decodeState(state) {
        if (!state) return null;
        try {
          var padded = state.replace(/-/g, '+').replace(/_/g, '/');
          while (padded.length % 4) padded += '=';
          return JSON.parse(atob(padded));
        } catch (e) {
          return null;
        }
      }

      function getParams() {
        var params = new URLSearchParams(window.location.search);
        if (window.location.hash && window.location.hash.length > 1) {
          var hash = window.location.hash.charAt(0) === '#' ? window.location.hash.slice(1) : window.location.hash;
          new URLSearchParams(hash).forEach(function (value, key) {
            params.set(key, value);
          });
        }
        return params;
      }

      function buildDeeplink(scheme, query) {
        var cleanScheme = String(scheme || DEFAULT_SCHEME).trim();
        if (!cleanScheme || cleanScheme.indexOf('://') !== -1) cleanScheme = DEFAULT_SCHEME;
        return cleanScheme + '://oauth/auth' + (query ? '?' + query : '');
      }

      function isValidDeeplink(url) {
        if (!url || typeof url !== 'string') return false;
        var value = url.trim();
        if (!value || value === '#' || value === 'vybe:' || value === 'vybe://') return false;
        if (value.length > MAX_DEEPLINK_LEN) return false;
        try {
          var parsed = new URL(value);
          return parsed.protocol === 'com.despia.vybe:' && value.indexOf('oauth') !== -1;
        } catch (e) {
          return false;
        }
      }

      function callAuthQr(payload) {
        return fetch(EXCHANGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: payload }),
        }).then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        });
      }

      function payloadOf(result) {
        return (result.data && result.data.result) || result.data || {};
      }

      /**
       * Short codes only in deeplinks. Long JWT/custom_token URLs break ASWeb
       * with Safari “The address is invalid.”
       */
      function redirectToApp(scheme, query) {
        var deeplink = buildDeeplink(scheme, query);
        var openBtn = document.getElementById('openApp');
        var webBtn = document.getElementById('webFallback');

        if (isValidDeeplink(deeplink)) {
          window.__vybeOauthDeeplink = deeplink;
          if (openBtn) openBtn.setAttribute('href', deeplink);
          try { window.location.href = deeplink; } catch (e) {}
          setTimeout(function () {
            try { window.location.replace(deeplink); } catch (e2) {}
          }, 120);
          setTimeout(function () {
            try {
              var a = document.createElement('a');
              a.href = deeplink;
              a.rel = 'noreferrer';
              document.body.appendChild(a);
              a.click();
              a.remove();
            } catch (e3) {}
          }, 280);
        } else {
          window.__vybeOauthDeeplink = '';
          if (openBtn) {
            openBtn.removeAttribute('href');
            openBtn.style.display = 'none';
          }
        }

        setTimeout(function () {
          if (webBtn) {
            webBtn.style.display = 'inline-block';
            webBtn.setAttribute('href', WEB_FALLBACK);
          }
          if (isValidDeeplink(window.__vybeOauthDeeplink) && openBtn) {
            openBtn.style.display = 'inline-block';
            setStatus('Tap below if VYBE did not open.');
          } else {
            setStatus('Continue in the browser if the app did not open.');
          }
        }, 900);
      }

      document.getElementById('openApp').addEventListener('click', function (ev) {
        if (!isValidDeeplink(window.__vybeOauthDeeplink)) {
          ev.preventDefault();
          return;
        }
        ev.preventDefault();
        window.location.href = window.__vybeOauthDeeplink;
      });

      var params = getParams();
      var stateObj = decodeState(params.get('state'));
      var scheme = (stateObj && stateObj.scheme) || DEFAULT_SCHEME;
      var idToken = params.get('id_token');
      var code = params.get('code');
      var error = params.get('error');
      var state = params.get('state') || '';
      var provider = (stateObj && stateObj.provider) || 'google';
      var nonce = (stateObj && stateObj.nonce) || '';

      if (error) {
        var errQuery = 'error=' + encodeURIComponent(error) + '&state=' + encodeURIComponent(state);
        var errDesc = params.get('error_description');
        if (errDesc) errQuery += '&error_description=' + encodeURIComponent(errDesc);
        redirectToApp(scheme, errQuery);
        return;
      }

      function finishWithHandoffCode(handoffCode) {
        if (!handoffCode) throw new Error('missing_handoff_code');
        var okQuery =
          'hc=' +
          encodeURIComponent(handoffCode) +
          '&state=' +
          encodeURIComponent(state);
        redirectToApp(scheme, okQuery);
      }

      // Apple — stash id_token server-side, deeplink only short handoff code.
      if (provider === 'apple' && idToken) {
        setStatus('Finishing Apple sign-in…');
        callAuthQr({
          action: 'stash_oauth',
          provider: 'apple',
          idToken: idToken,
          nonce: nonce,
        })
          .then(function (result) {
            var payload = payloadOf(result);
            if (!result.ok || !payload.code) {
              throw new Error((payload.message || payload.error) || 'stash_failed');
            }
            finishWithHandoffCode(payload.code);
          })
          .catch(function () {
            setStatus('Could not finish Apple sign-in automatically.');
            if (document.getElementById('webFallback')) {
              document.getElementById('webFallback').style.display = 'inline-block';
            }
          });
        return;
      }

      if (!idToken) {
        redirectToApp(scheme, 'error=missing_token&state=' + encodeURIComponent(state));
        return;
      }

      setStatus('Finishing Google sign-in…');

      callAuthQr({ action: 'exchange_google', idToken: idToken })
        .then(function (result) {
          var payload = payloadOf(result);
          var handoff = payload.code;
          var token = payload.customToken || payload.custom_token;
          if (!result.ok) {
            var errMsg =
              (result.data && result.data.error && result.data.error.message) ||
              payload.message ||
              payload.error ||
              'exchange_failed';
            throw new Error(errMsg);
          }
          if (handoff) {
            finishWithHandoffCode(handoff);
            return;
          }
          // Fallback: stash custom token if older function lacked `code`.
          if (token) {
            return callAuthQr({
              action: 'stash_oauth',
              provider: 'google',
              customToken: token,
            }).then(function (stashRes) {
              var stashPayload = payloadOf(stashRes);
              if (!stashRes.ok || !stashPayload.code) throw new Error('stash_failed');
              finishWithHandoffCode(stashPayload.code);
            });
          }
          throw new Error('exchange_failed');
        })
        .catch(function () {
          setStatus('Could not finish automatically. Try Continue on web.');
          var webBtn = document.getElementById('webFallback');
          if (webBtn) webBtn.style.display = 'inline-block';
        });
    })();
  </script>
</body>
</html>
