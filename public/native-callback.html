<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0B0B10;
      color: #a1a1aa;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }
    #status { margin: 0; font-size: 14px; opacity: 0; }
    #status.visible { opacity: 0.85; }
    #openApp, #webFallback {
      display: none;
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 14px 22px;
      background: #fff;
      color: #0B0B10;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }
    #webFallback {
      background: transparent;
      color: #a1a1aa;
      border: 1px solid #3f3f46;
    }
  </style>
</head>
<body>
  <p id="status" aria-hidden="true"></p>
  <a id="openApp">Open VYBE</a>
  <a id="webFallback" href="https://vybehub.app/auth">Continue on web</a>
  <script>
    /**
     * Runs inside Despia ASWeb / Custom Tabs after Google/Apple account pick.
     * Strategy for instant sheet close:
     *  1) Kick off authQr stash/exchange with fetch keepalive (survives unload)
     *  2) Immediately fire scheme://oauth/auth?nonce=…&wait=1 so Despia closes the sheet
     *  3) App WebView polls authQr by nonce and signs in
     * If exchange finishes while this page is still open, also fire hc= deeplink.
     */
    (function () {
      var DEFAULT_SCHEME = 'com.despia.vybe';
      var PACKAGE_NAME = 'com.despia.vybe';
      var EXCHANGE_URL = 'https://us-central1-vybe-daaab.cloudfunctions.net/authQr';
      var WEB_FALLBACK = 'https://vybehub.app/auth';
      var MAX_DEEPLINK_LEN = 1800;
      /** Silent retries before showing Open VYBE (Android CCT often needs multi-fire). */
      var SILENT_RETRY_MS = 1600;
      var SILENT_RETRY_INTERVAL_MS = 200;
      var FALLBACK_UI_MS = 2200;
      var closed = false;
      var fallbackScheduled = false;
      var retryTimer = null;

      function isAndroidUa() {
        return /Android/i.test(navigator.userAgent || '');
      }

      function setStatus(text, visible) {
        var el = document.getElementById('status');
        if (!el) return;
        el.textContent = text || '';
        if (visible) el.classList.add('visible');
        else el.classList.remove('visible');
      }

      function decodeState(state) {
        if (!state) return null;
        try {
          var padded = state.replace(/-/g, '+').replace(/_/g, '/');
          while (padded.length % 4) padded += '=';
          return JSON.parse(atob(padded));
        } catch (e) {
          return null;
        }
      }

      function getParams() {
        var params = new URLSearchParams(window.location.search);
        if (window.location.hash && window.location.hash.length > 1) {
          var hash = window.location.hash.charAt(0) === '#' ? window.location.hash.slice(1) : window.location.hash;
          new URLSearchParams(hash).forEach(function (value, key) {
            params.set(key, value);
          });
        }
        return params;
      }

      function buildDeeplink(scheme, query) {
        var cleanScheme = String(scheme || DEFAULT_SCHEME).trim();
        if (!cleanScheme || cleanScheme.indexOf('://') !== -1) cleanScheme = DEFAULT_SCHEME;
        return cleanScheme + '://oauth/auth' + (query ? '?' + query : '');
      }

      function isValidDeeplink(url) {
        if (!url || typeof url !== 'string') return false;
        var value = url.trim();
        if (!value || value.length > MAX_DEEPLINK_LEN) return false;
        if (value.indexOf('oauth') === -1) return false;
        try {
          var parsed = new URL(value);
          var proto = String(parsed.protocol || '').replace(/:$/, '');
          return Boolean(proto) && proto !== 'http' && proto !== 'https' && proto !== 'javascript';
        } catch (e) {
          return false;
        }
      }

      /** Android Intent URL — Custom Tabs often honor this when scheme:// alone is ignored. */
      function buildAndroidIntentUrl(deeplink) {
        try {
          var parsed = new URL(deeplink);
          var scheme = String(parsed.protocol || '').replace(/:$/, '');
          if (!scheme || scheme === 'http' || scheme === 'https') return null;
          var path = (parsed.hostname || '') + (parsed.pathname || '');
          if (path.charAt(0) === '/') path = path.slice(1);
          var query = parsed.search ? parsed.search.slice(1) : '';
          var intent =
            'intent://' +
            path +
            (query ? '?' + query : '') +
            '#Intent;scheme=' +
            encodeURIComponent(scheme) +
            ';package=' +
            encodeURIComponent(PACKAGE_NAME) +
            ';end';
          return intent;
        } catch (e) {
          return null;
        }
      }

      /**
       * Despia closes ASWeb / Custom Tabs on scheme://oauth/…
       * Android CCT often ignores a single location.replace — multi-fire + intent://.
       */
      function fireDeeplinkOnce(deeplink) {
        if (!isValidDeeplink(deeplink)) return;
        window.__vybeOauthDeeplink = deeplink;
        var openBtn = document.getElementById('openApp');
        if (openBtn) openBtn.setAttribute('href', deeplink);

        // 1) Official Despia pattern
        try { window.location.href = deeplink; } catch (e1) {}
        // 2) replace backup
        try { window.location.replace(deeplink); } catch (e2) {}
        // 3) Hidden iframe
        try {
          var iframe = document.createElement('iframe');
          iframe.setAttribute('aria-hidden', 'true');
          iframe.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden';
          iframe.src = deeplink;
          document.body.appendChild(iframe);
          setTimeout(function () {
            try { iframe.remove(); } catch (e3) {}
          }, 800);
        } catch (e4) {}
        // 4) Synthetic <a> click
        try {
          var a = document.createElement('a');
          a.href = deeplink;
          a.rel = 'noopener';
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          setTimeout(function () {
            try { a.remove(); } catch (e5) {}
          }, 100);
        } catch (e6) {}
        // 5) Android intent://
        if (isAndroidUa()) {
          var intentUrl = buildAndroidIntentUrl(deeplink);
          if (intentUrl) {
            try { window.location.href = intentUrl; } catch (e7) {}
          }
        }
        try { window.close(); } catch (e8) {}
      }

      function startSilentRetries(deeplink) {
        if (retryTimer != null) return;
        var startedAt = Date.now();
        function tick() {
          if (closed) {
            retryTimer = null;
            return;
          }
          if (Date.now() - startedAt >= SILENT_RETRY_MS) {
            retryTimer = null;
            return;
          }
          fireDeeplinkOnce(deeplink);
          retryTimer = setTimeout(tick, SILENT_RETRY_INTERVAL_MS);
        }
        retryTimer = setTimeout(tick, SILENT_RETRY_INTERVAL_MS);
      }

      function scheduleFallback() {
        if (fallbackScheduled) return;
        fallbackScheduled = true;
        setTimeout(function () {
          if (closed) return;
          var openBtn = document.getElementById('openApp');
          var webBtn = document.getElementById('webFallback');
          if (webBtn) {
            webBtn.style.display = 'inline-block';
            webBtn.setAttribute('href', WEB_FALLBACK);
          }
          if (isValidDeeplink(window.__vybeOauthDeeplink) && openBtn) {
            openBtn.style.display = 'inline-block';
            setStatus('Tap below if VYBE did not open.', true);
          }
        }, FALLBACK_UI_MS);
      }

      function closeSheetNow(scheme, query) {
        var deeplink = buildDeeplink(scheme, query);
        fireDeeplinkOnce(deeplink);
        startSilentRetries(deeplink);
        scheduleFallback();
      }

      function callAuthQr(payload) {
        return fetch(EXCHANGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: payload }),
          // Survives Custom Tabs teardown after we fire the close deeplink.
          keepalive: true,
        }).then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        });
      }

      function payloadOf(result) {
        return (result.data && result.data.result) || result.data || {};
      }

      document.getElementById('openApp').addEventListener('click', function (ev) {
        if (!isValidDeeplink(window.__vybeOauthDeeplink)) {
          ev.preventDefault();
          return;
        }
        ev.preventDefault();
        fireDeeplinkOnce(window.__vybeOauthDeeplink);
      });

      // Detect page hide = Despia closed the sheet successfully.
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') closed = true;
      });
      window.addEventListener('pagehide', function () { closed = true; });

      var params = getParams();
      var stateObj = decodeState(params.get('state'));
      var scheme = (stateObj && stateObj.scheme) || DEFAULT_SCHEME;
      var idToken = params.get('id_token');
      var error = params.get('error');
      var state = params.get('state') || '';
      var provider = (stateObj && stateObj.provider) || 'google';
      var nonce = (stateObj && stateObj.nonce) || '';

      setStatus('', false);

      if (error) {
        var errQuery = 'error=' + encodeURIComponent(error) + '&state=' + encodeURIComponent(state);
        var errDesc = params.get('error_description');
        if (errDesc) errQuery += '&error_description=' + encodeURIComponent(errDesc);
        closeSheetNow(scheme, errQuery);
        return;
      }

      if (!idToken) {
        closeSheetNow(scheme, 'error=missing_token&state=' + encodeURIComponent(state));
        return;
      }

      // Instant close: app polls by nonce while we stash/exchange with keepalive.
      if (nonce) {
        var waitQuery =
          'nonce=' +
          encodeURIComponent(nonce) +
          '&wait=1&provider=' +
          encodeURIComponent(provider) +
          '&state=' +
          encodeURIComponent(state);
        closeSheetNow(scheme, waitQuery);
      }

      var stashPromise =
        provider === 'apple'
          ? callAuthQr({
              action: 'stash_oauth',
              provider: 'apple',
              idToken: idToken,
              nonce: nonce,
            })
          : callAuthQr({ action: 'exchange_google', idToken: idToken, nonce: nonce });

      stashPromise
        .then(function (result) {
          var payload = payloadOf(result);
          var handoff = payload.code;
          if (!result.ok || !handoff) {
            var errMsg =
              (result.data && result.data.error && result.data.error.message) ||
              payload.message ||
              payload.error ||
              'exchange_failed';
            throw new Error(errMsg);
          }
          // If sheet still open (close failed), fire hc= so Despia can reclaim.
          if (!closed) {
            closeSheetNow(
              scheme,
              'hc=' + encodeURIComponent(handoff) + '&state=' + encodeURIComponent(state),
            );
          }
        })
        .catch(function () {
          if (closed) return;
          setStatus('Could not finish automatically.', true);
          closeSheetNow(scheme, 'error=exchange_failed&state=' + encodeURIComponent(state));
          var webBtn = document.getElementById('webFallback');
          if (webBtn) webBtn.style.display = 'inline-block';
        });
    })();
  </script>
</body>
</html>
