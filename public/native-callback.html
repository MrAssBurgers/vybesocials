<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0B0B10; }
  </style>
</head>
<body>
  <script>
    /**
     * Despia OAuth return (Google/Apple). Runs inside ASWeb / Custom Tabs.
     * Soft-close immediately with {scheme}://oauth/…&wait=1 (Despia closes sheet),
     * exchange continues with keepalive, then hard-close with hc=.
     * Android App Link is fallback only if the sheet is still open.
     */
    (function () {
      var DEFAULT_SCHEME = 'com.despia.vybe';
      var EXCHANGE_URL = 'https://us-central1-vybe-daaab.cloudfunctions.net/authQr';
      var APP_ORIGIN = 'https://vybehub.app';
      var closed = false;
      var softFired = false;

      // #region agent log
      function dbg(hypothesisId, message, data) {
        try {
          fetch(EXCHANGE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              data: {
                action: 'debug_oauth',
                event: message,
                hypothesisId: hypothesisId,
                location: 'native-callback.html',
                payload: data || {},
              },
            }),
            keepalive: true,
          }).catch(function () {});
        } catch (e1) {}
      }
      // #endregion

      function decodeState(state) {
        if (!state) return null;
        try {
          var padded = state.replace(/-/g, '+').replace(/_/g, '/');
          while (padded.length % 4) padded += '=';
          return JSON.parse(atob(padded));
        } catch (e) {
          return null;
        }
      }

      function getParams() {
        var params = new URLSearchParams(window.location.search);
        if (window.location.hash && window.location.hash.length > 1) {
          var hash = window.location.hash.charAt(0) === '#' ? window.location.hash.slice(1) : window.location.hash;
          new URLSearchParams(hash).forEach(function (value, key) {
            params.set(key, value);
          });
        }
        return params;
      }

      function isAndroid() {
        return /Android/i.test(navigator.userAgent || '');
      }

      function callAuthQr(payload) {
        return fetch(EXCHANGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: payload }),
          keepalive: true,
        }).then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        });
      }

      function payloadOf(result) {
        return (result.data && result.data.result) || result.data || {};
      }

      function errMsgOf(result) {
        var d = result && result.data;
        if (!d) return null;
        if (d.error) {
          if (typeof d.error === 'string') return d.error;
          if (d.error.message) return String(d.error.message);
          return JSON.stringify(d.error).slice(0, 120);
        }
        if (d.message) return String(d.message);
        return null;
      }

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') closed = true;
      });
      window.addEventListener('pagehide', function () {
        closed = true;
      });

      var params = getParams();
      var stateObj = decodeState(params.get('state'));
      var idToken = params.get('id_token');
      var error = params.get('error');
      var provider = (stateObj && stateObj.provider) || 'google';
      var nonce = (stateObj && stateObj.nonce) || '';
      var intent = (stateObj && stateObj.intent) || 'signin';
      var scheme = DEFAULT_SCHEME;
      if (stateObj && stateObj.scheme) {
        var s = String(stateObj.scheme).trim();
        if (s && s.indexOf('://') === -1) scheme = s;
      }

      /** Despia-required close: {scheme}://oauth/… — single location.href. */
      function fireDeeplink(query) {
        var deeplink = scheme + '://oauth/auth?' + query;
        // #region agent log
        dbg('A', 'fire_deeplink', {
          android: isAndroid(),
          queryLen: query.length,
          hasHc: query.indexOf('hc=') !== -1,
          hasWait: query.indexOf('wait=') !== -1,
          provider: provider,
          intent: intent,
        });
        // #endregion
        try {
          window.location.href = deeplink;
        } catch (e1) {}
      }

      function fireAppLinkFallback(query) {
        if (!isAndroid() || closed) return;
        var appLink = APP_ORIGIN + '/auth?' + query;
        // #region agent log
        dbg('F', 'android_applink_fallback', {
          hasHc: query.indexOf('hc=') !== -1,
          queryLen: query.length,
        });
        // #endregion
        try {
          window.location.replace(appLink);
        } catch (e2) {}
      }

      function hardFire(query) {
        if (!query || closed) return;
        fireDeeplink(query);
        // Android CCT sometimes ignores custom schemes — App Link backup.
        if (isAndroid()) {
          setTimeout(function () {
            if (!closed) fireAppLinkFallback(query);
          }, 450);
        }
      }

      // Soft-close ASAP so the sheet dismisses while exchange runs (nonce poll finishes login).
      if (nonce && !error) {
        softFired = true;
        var softQ =
          'nonce=' +
          encodeURIComponent(nonce) +
          '&wait=1&provider=' +
          encodeURIComponent(provider);
        if (intent === 'link') softQ += '&intent=link';
        fireDeeplink(softQ);
      }

      // #region agent log
      dbg('B', 'callback_boot', {
        hasIdToken: Boolean(idToken),
        idTokenLen: idToken ? String(idToken).length : 0,
        provider: provider,
        intent: intent,
        hasError: Boolean(error),
        android: isAndroid(),
        hasNonce: Boolean(nonce),
        softFired: softFired,
      });
      // #endregion

      if (error) {
        hardFire('error=' + encodeURIComponent(String(error).slice(0, 64)));
        return;
      }

      if (!idToken) {
        hardFire('error=missing_token');
        return;
      }

      var stashPromise =
        provider === 'apple'
          ? callAuthQr({
              action: 'exchange_apple',
              idToken: idToken,
              nonce: nonce,
            })
          : callAuthQr({ action: 'exchange_google', idToken: idToken, nonce: nonce });

      stashPromise
        .then(function (result) {
          var payload = payloadOf(result);
          var handoff = payload.code;
          // #region agent log
          dbg('B', 'exchange_result', {
            ok: Boolean(result.ok),
            hasHandoff: Boolean(handoff),
            handoffLen: handoff ? String(handoff).length : 0,
            provider: provider,
            errMsg: errMsgOf(result),
          });
          // #endregion
          if (!result.ok || !handoff) throw new Error(errMsgOf(result) || 'exchange_failed');
          var q = 'hc=' + encodeURIComponent(handoff);
          if (intent === 'link') q += '&intent=link';
          if (!closed) {
            hardFire(q);
          }
        })
        .catch(function (err) {
          // #region agent log
          dbg('B', 'exchange_failed', {
            provider: provider,
            msg: err && err.message ? String(err.message).slice(0, 120) : 'fail',
          });
          // #endregion
          if (!closed) hardFire('error=exchange_failed');
        });
    })();
  </script>
</body>
</html>
