<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0B0B10; }
  </style>
</head>
<body>
  <script>
    /**
     * https://vybehub.app/native-callback.html — Despia Google/Apple return.
     * Exchange id_token → short hc=, then close:
     * - Android: HTTPS App Link (Custom Tabs ignore custom schemes)
     * - iOS: short com.despia.vybe://oauth/auth?hc= (ASWeb dismiss). Also rely on
     *   in-app nonce poll so login completes even if the scheme alert is dismissed.
     */
    (function () {
      var DEFAULT_SCHEME = 'com.despia.vybe';
      var EXCHANGE_URL = 'https://us-central1-vybe-daaab.cloudfunctions.net/authQr';
      var APP_ORIGIN = 'https://vybehub.app';
      var closed = false;
      var INGEST = 'http://127.0.0.1:7693/ingest/1847f3ab-7d03-4b99-8dbe-84076ae9145e';

      // #region agent log
      function dbg(hypothesisId, message, data) {
        var body = {
          sessionId: 'bd2545',
          runId: 'post-fix',
          hypothesisId: hypothesisId,
          location: 'native-callback.html',
          message: message,
          data: data || {},
          timestamp: Date.now(),
        };
        try {
          fetch(INGEST, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Debug-Session-Id': 'bd2545' },
            body: JSON.stringify(body),
            keepalive: true,
          }).catch(function () {});
        } catch (e0) {}
        try {
          fetch(EXCHANGE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              data: {
                action: 'debug_oauth',
                event: message,
                hypothesisId: hypothesisId,
                location: 'native-callback.html',
                payload: data || {},
              },
            }),
            keepalive: true,
          }).catch(function () {});
        } catch (e1) {}
      }
      // #endregion

      function decodeState(state) {
        if (!state) return null;
        try {
          var padded = state.replace(/-/g, '+').replace(/_/g, '/');
          while (padded.length % 4) padded += '=';
          return JSON.parse(atob(padded));
        } catch (e) {
          return null;
        }
      }

      function getParams() {
        var params = new URLSearchParams(window.location.search);
        if (window.location.hash && window.location.hash.length > 1) {
          var hash = window.location.hash.charAt(0) === '#' ? window.location.hash.slice(1) : window.location.hash;
          new URLSearchParams(hash).forEach(function (value, key) {
            params.set(key, value);
          });
        }
        return params;
      }

      function isAndroid() {
        return /Android/i.test(navigator.userAgent || '');
      }

      function callAuthQr(payload) {
        return fetch(EXCHANGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: payload }),
          keepalive: true,
        }).then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        });
      }

      function payloadOf(result) {
        return (result.data && result.data.result) || result.data || {};
      }

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') closed = true;
      });
      window.addEventListener('pagehide', function () {
        closed = true;
      });

      var params = getParams();
      var stateObj = decodeState(params.get('state'));
      var idToken = params.get('id_token');
      var error = params.get('error');
      var provider = (stateObj && stateObj.provider) || 'google';
      var nonce = (stateObj && stateObj.nonce) || '';
      var scheme = DEFAULT_SCHEME;
      if (stateObj && stateObj.scheme) {
        var s = String(stateObj.scheme).trim();
        if (s && s.indexOf('://') === -1) scheme = s;
      }

      function hardFire(query) {
        if (!query) return;
        // #region agent log
        dbg('A', 'hardFire', {
          android: isAndroid(),
          queryLen: query.length,
          hasHc: query.indexOf('hc=') !== -1,
          provider: provider,
        });
        // #endregion
        if (isAndroid()) {
          var appLink = APP_ORIGIN + '/auth?' + query;
          try { window.location.replace(appLink); } catch (e1) {}
          try { window.location.href = appLink; } catch (e2) {}
          return;
        }
        // iOS: only short oauth/ custom scheme (never HTTPS — that logs into the sheet).
        var deeplink = scheme + '://oauth/auth?' + query;
        try {
          var a = document.createElement('a');
          a.href = deeplink;
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
        } catch (eA) {}
        try { window.location.replace(deeplink); } catch (e3) {}
        try { window.location.href = deeplink; } catch (e4) {}
        try { window.close(); } catch (e5) {}
      }

      // #region agent log
      dbg('B', 'callback_boot', {
        hasIdToken: Boolean(idToken),
        idTokenLen: idToken ? String(idToken).length : 0,
        provider: provider,
        hasError: Boolean(error),
        android: isAndroid(),
        hasNonce: Boolean(nonce),
      });
      // #endregion

      if (error) {
        hardFire('error=' + encodeURIComponent(String(error).slice(0, 64)));
        return;
      }

      if (!idToken) {
        hardFire('error=missing_token');
        return;
      }

      var stashPromise =
        provider === 'apple'
          ? callAuthQr({
              action: 'exchange_apple',
              idToken: idToken,
              nonce: nonce,
            })
          : callAuthQr({ action: 'exchange_google', idToken: idToken, nonce: nonce });

      stashPromise
        .then(function (result) {
          var payload = payloadOf(result);
          var handoff = payload.code;
          // #region agent log
          dbg('B', 'exchange_result', {
            ok: Boolean(result.ok),
            hasHandoff: Boolean(handoff),
            handoffLen: handoff ? String(handoff).length : 0,
            provider: provider,
            errMsg: payload.error || payload.message || null,
          });
          // #endregion
          if (!result.ok || !handoff) throw new Error('exchange_failed');
          if (!closed) {
            hardFire('hc=' + encodeURIComponent(handoff));
          }
        })
        .catch(function (err) {
          // #region agent log
          dbg('B', 'exchange_failed', {
            provider: provider,
            msg: err && err.message ? String(err.message).slice(0, 120) : 'fail',
          });
          // #endregion
          if (!closed) hardFire('error=exchange_failed');
        });
    })();
  </script>
</body>
</html>
