<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0B0B10;
      color: #a1a1aa;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }
    #status { margin: 0; font-size: 14px; opacity: 0; }
    #status.visible { opacity: 0.85; }
    #openApp {
      display: none;
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 14px 22px;
      background: #fff;
      color: #0B0B10;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <p id="status" aria-hidden="true"></p>
  <a id="openApp">Open VYBE</a>
  <script>
    /**
     * Runs inside Despia ASWeb / Custom Tabs after Google/Apple account pick.
     *
     * Order matters on Android:
     *  1) Start authQr stash/exchange FIRST (keepalive) — do not navigate yet
     *  2) Soft-fire close (iframe / <a> / intent://) so we do not kill the fetch
     *  3) When handoff code is ready, hard-fire scheme://oauth/auth?hc=… (location.href)
     * App WebView polls by nonce and signs in; CCT must dismiss for timers to run reliably.
     */
    (function () {
      var DEFAULT_SCHEME = 'com.despia.vybe';
      var PACKAGE_NAME = 'com.despia.vybe';
      var EXCHANGE_URL = 'https://us-central1-vybe-daaab.cloudfunctions.net/authQr';
      var MAX_DEEPLINK_LEN = 1800;
      var SILENT_RETRY_MS = 2500;
      var SILENT_RETRY_INTERVAL_MS = 250;
      var FALLBACK_UI_MS = 2800;
      var closed = false;
      var fallbackScheduled = false;
      var retryTimer = null;
      var hardFired = false;

      function isAndroidUa() {
        return /Android/i.test(navigator.userAgent || '');
      }

      function setStatus(text, visible) {
        var el = document.getElementById('status');
        if (!el) return;
        el.textContent = text || '';
        if (visible) el.classList.add('visible');
        else el.classList.remove('visible');
      }

      function decodeState(state) {
        if (!state) return null;
        try {
          var padded = state.replace(/-/g, '+').replace(/_/g, '/');
          while (padded.length % 4) padded += '=';
          return JSON.parse(atob(padded));
        } catch (e) {
          return null;
        }
      }

      function getParams() {
        var params = new URLSearchParams(window.location.search);
        if (window.location.hash && window.location.hash.length > 1) {
          var hash = window.location.hash.charAt(0) === '#' ? window.location.hash.slice(1) : window.location.hash;
          new URLSearchParams(hash).forEach(function (value, key) {
            params.set(key, value);
          });
        }
        return params;
      }

      function buildDeeplink(scheme, query) {
        var cleanScheme = String(scheme || DEFAULT_SCHEME).trim();
        if (!cleanScheme || cleanScheme.indexOf('://') !== -1) cleanScheme = DEFAULT_SCHEME;
        return cleanScheme + '://oauth/auth' + (query ? '?' + query : '');
      }

      function isValidDeeplink(url) {
        if (!url || typeof url !== 'string') return false;
        var value = url.trim();
        if (!value || value.length > MAX_DEEPLINK_LEN) return false;
        if (value.indexOf('oauth') === -1) return false;
        try {
          var parsed = new URL(value);
          var proto = String(parsed.protocol || '').replace(/:$/, '');
          return Boolean(proto) && proto !== 'http' && proto !== 'https' && proto !== 'javascript';
        } catch (e) {
          return false;
        }
      }

      function buildAndroidIntentUrl(deeplink) {
        try {
          var parsed = new URL(deeplink);
          var scheme = String(parsed.protocol || '').replace(/:$/, '');
          if (!scheme || scheme === 'http' || scheme === 'https') return null;
          var path = (parsed.hostname || '') + (parsed.pathname || '');
          if (path.charAt(0) === '/') path = path.slice(1);
          var query = parsed.search ? parsed.search.slice(1) : '';
          return (
            'intent://' +
            path +
            (query ? '?' + query : '') +
            '#Intent;scheme=' +
            encodeURIComponent(scheme) +
            ';package=' +
            encodeURIComponent(PACKAGE_NAME) +
            ';end'
          );
        } catch (e) {
          return null;
        }
      }

      function setOpenAppHref(deeplink) {
        if (!isValidDeeplink(deeplink)) return;
        window.__vybeOauthDeeplink = deeplink;
        var openBtn = document.getElementById('openApp');
        if (openBtn) openBtn.setAttribute('href', deeplink);
      }

      /** Soft close: does not navigate the top-level page (keeps fetch alive). */
      function softFire(deeplink) {
        if (!isValidDeeplink(deeplink)) return;
        setOpenAppHref(deeplink);
        try {
          var iframe = document.createElement('iframe');
          iframe.setAttribute('aria-hidden', 'true');
          iframe.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden';
          iframe.src = deeplink;
          document.body.appendChild(iframe);
          setTimeout(function () {
            try { iframe.remove(); } catch (e1) {}
          }, 800);
        } catch (e2) {}
        try {
          var a = document.createElement('a');
          a.href = deeplink;
          a.rel = 'noopener';
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          setTimeout(function () {
            try { a.remove(); } catch (e3) {}
          }, 100);
        } catch (e4) {}
        if (isAndroidUa()) {
          var intentUrl = buildAndroidIntentUrl(deeplink);
          if (intentUrl) {
            try {
              var ai = document.createElement('a');
              ai.href = intentUrl;
              ai.rel = 'noopener';
              ai.style.display = 'none';
              document.body.appendChild(ai);
              ai.click();
              setTimeout(function () {
                try { ai.remove(); } catch (e5) {}
              }, 100);
            } catch (e6) {}
          }
        }
      }

      /** Hard close: Despia official — top-level navigation to scheme://oauth/… */
      function hardFire(deeplink) {
        if (!isValidDeeplink(deeplink)) return;
        hardFired = true;
        setOpenAppHref(deeplink);
        softFire(deeplink);
        try { window.location.href = deeplink; } catch (e1) {}
        try { window.location.replace(deeplink); } catch (e2) {}
        if (isAndroidUa()) {
          var intentUrl = buildAndroidIntentUrl(deeplink);
          if (intentUrl) {
            try { window.location.href = intentUrl; } catch (e3) {}
          }
        }
        try { window.close(); } catch (e4) {}
      }

      function startSoftRetries(deeplink) {
        if (retryTimer != null) return;
        var startedAt = Date.now();
        function tick() {
          if (closed || hardFired) {
            retryTimer = null;
            return;
          }
          if (Date.now() - startedAt >= SILENT_RETRY_MS) {
            retryTimer = null;
            return;
          }
          softFire(deeplink);
          retryTimer = setTimeout(tick, SILENT_RETRY_INTERVAL_MS);
        }
        softFire(deeplink);
        retryTimer = setTimeout(tick, SILENT_RETRY_INTERVAL_MS);
      }

      function scheduleFallback() {
        if (fallbackScheduled) return;
        fallbackScheduled = true;
        setTimeout(function () {
          if (closed) return;
          var openBtn = document.getElementById('openApp');
          if (isValidDeeplink(window.__vybeOauthDeeplink) && openBtn) {
            openBtn.style.display = 'inline-block';
            setStatus('Tap Open VYBE to finish.', true);
          }
        }, FALLBACK_UI_MS);
      }

      function callAuthQr(payload) {
        return fetch(EXCHANGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: payload }),
          keepalive: true,
        }).then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        });
      }

      function payloadOf(result) {
        return (result.data && result.data.result) || result.data || {};
      }

      document.getElementById('openApp').addEventListener('click', function (ev) {
        if (!isValidDeeplink(window.__vybeOauthDeeplink)) {
          ev.preventDefault();
          return;
        }
        ev.preventDefault();
        hardFire(window.__vybeOauthDeeplink);
      });

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') closed = true;
      });
      window.addEventListener('pagehide', function () { closed = true; });

      var params = getParams();
      var stateObj = decodeState(params.get('state'));
      var scheme = (stateObj && stateObj.scheme) || DEFAULT_SCHEME;
      var idToken = params.get('id_token');
      var error = params.get('error');
      var state = params.get('state') || '';
      var provider = (stateObj && stateObj.provider) || 'google';
      var nonce = (stateObj && stateObj.nonce) || '';

      setStatus('', false);

      if (error) {
        var errQuery = 'error=' + encodeURIComponent(error) + '&state=' + encodeURIComponent(state);
        var errDesc = params.get('error_description');
        if (errDesc) errQuery += '&error_description=' + encodeURIComponent(errDesc);
        hardFire(buildDeeplink(scheme, errQuery));
        scheduleFallback();
        return;
      }

      if (!idToken) {
        hardFire(buildDeeplink(scheme, 'error=missing_token&state=' + encodeURIComponent(state)));
        scheduleFallback();
        return;
      }

      // Soft-close while exchange runs — do NOT location.href yet (kills fetch on Android).
      if (nonce) {
        var waitQuery =
          'nonce=' +
          encodeURIComponent(nonce) +
          '&wait=1&provider=' +
          encodeURIComponent(provider) +
          '&state=' +
          encodeURIComponent(state);
        startSoftRetries(buildDeeplink(scheme, waitQuery));
        scheduleFallback();
      }

      var stashPromise =
        provider === 'apple'
          ? callAuthQr({
              action: 'stash_oauth',
              provider: 'apple',
              idToken: idToken,
              nonce: nonce,
            })
          : callAuthQr({ action: 'exchange_google', idToken: idToken, nonce: nonce });

      stashPromise
        .then(function (result) {
          var payload = payloadOf(result);
          var handoff = payload.code;
          if (!result.ok || !handoff) {
            var errMsg =
              (result.data && result.data.error && result.data.error.message) ||
              payload.message ||
              payload.error ||
              'exchange_failed';
            throw new Error(errMsg);
          }
          // Handoff ready — hard-fire so Despia closes CCT and WebView gets hc=.
          var hcQuery =
            'hc=' + encodeURIComponent(handoff) + '&state=' + encodeURIComponent(state);
          var hcDeeplink = buildDeeplink(scheme, hcQuery);
          setOpenAppHref(hcDeeplink);
          if (!closed) {
            hardFire(hcDeeplink);
            startSoftRetries(hcDeeplink);
          }
        })
        .catch(function () {
          if (closed) return;
          setStatus('Could not finish automatically.', true);
          var failLink = buildDeeplink(scheme, 'error=exchange_failed&state=' + encodeURIComponent(state));
          setOpenAppHref(failLink);
          hardFire(failLink);
          var openBtn = document.getElementById('openApp');
          if (openBtn) openBtn.style.display = 'inline-block';
        });
    })();
  </script>
</body>
</html>
