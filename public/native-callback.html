<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VYBE · Sign in</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0B0B10; color: #a1a1aa; font-family: system-ui, -apple-system, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px;
      text-align: center;
    }
    .brand { font-size: 22px; font-weight: 700; letter-spacing: 0.12em; color: #fafafa; }
    .sub { font-size: 13px; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="brand">VYBE</div>
  <div class="sub">Signing in · vybehub.app</div>
  <script>
    /**
     * https://vybehub.app/native-callback.html
     * Google (id_token) + Apple (fragment) Despia return.
     * Exchange FIRST (keepalive), then short hc= deeplink — never long state.
     */
    (function () {
      var DEFAULT_SCHEME = 'com.despia.vybe';
      var EXCHANGE_URL = 'https://us-central1-vybe-daaab.cloudfunctions.net/authQr';

      function decodeState(state) {
        if (!state) return null;
        try {
          var padded = state.replace(/-/g, '+').replace(/_/g, '/');
          while (padded.length % 4) padded += '=';
          return JSON.parse(atob(padded));
        } catch (e) {
          return null;
        }
      }

      function getParams() {
        var params = new URLSearchParams(window.location.search);
        if (window.location.hash && window.location.hash.length > 1) {
          var hash = window.location.hash.charAt(0) === '#' ? window.location.hash.slice(1) : window.location.hash;
          new URLSearchParams(hash).forEach(function (value, key) {
            params.set(key, value);
          });
        }
        return params;
      }

      function buildDeeplink(scheme, query) {
        var cleanScheme = String(scheme || DEFAULT_SCHEME).trim();
        if (!cleanScheme || cleanScheme.indexOf('://') !== -1) cleanScheme = DEFAULT_SCHEME;
        return cleanScheme + '://oauth/auth?' + query;
      }

      function fireClose(deeplink) {
        if (!deeplink || deeplink.indexOf('oauth') === -1) return;
        try { window.location.replace(deeplink); } catch (e1) {}
        try { window.location.href = deeplink; } catch (e2) {}
      }

      function callAuthQr(payload) {
        return fetch(EXCHANGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: payload }),
          keepalive: true,
        }).then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        });
      }

      function payloadOf(result) {
        return (result.data && result.data.result) || result.data || {};
      }

      var params = getParams();
      var stateObj = decodeState(params.get('state'));
      var scheme = (stateObj && stateObj.scheme) || DEFAULT_SCHEME;
      var idToken = params.get('id_token');
      var error = params.get('error');
      var provider = (stateObj && stateObj.provider) || 'google';
      var nonce = (stateObj && stateObj.nonce) || '';

      if (error) {
        fireClose(buildDeeplink(scheme, 'error=' + encodeURIComponent(String(error).slice(0, 64))));
        return;
      }

      if (!idToken) {
        fireClose(buildDeeplink(scheme, 'error=missing_token'));
        return;
      }

      // Start exchange before any close navigation (app already polls by nonce).
      var stashPromise =
        provider === 'apple'
          ? callAuthQr({
              action: 'stash_oauth',
              provider: 'apple',
              idToken: idToken,
              nonce: nonce,
            })
          : callAuthQr({ action: 'exchange_google', idToken: idToken, nonce: nonce });

      stashPromise
        .then(function (result) {
          var payload = payloadOf(result);
          var handoff = payload.code;
          if (!result.ok || !handoff) throw new Error('exchange_failed');
          var link = buildDeeplink(scheme, 'hc=' + encodeURIComponent(handoff));
          fireClose(link);
          setTimeout(function () { fireClose(link); }, 60);
        })
        .catch(function () {
          fireClose(buildDeeplink(scheme, 'error=exchange_failed'));
        });
    })();
  </script>
</body>
</html>
