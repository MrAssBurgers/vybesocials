<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing in…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0B0B10;
      color: #a1a1aa;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      text-align: center;
    }
    #status { margin: 0; }
    #openApp, #webFallback {
      display: none;
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 14px 22px;
      background: #fff;
      color: #0B0B10;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    #webFallback {
      background: transparent;
      color: #a1a1aa;
      border: 1px solid #3f3f46;
    }
  </style>
</head>
<body>
  <p id="status">Completing sign-in…</p>
  <a id="openApp" href="#">Open VYBE</a>
  <a id="webFallback" href="https://vybehub.app/auth/callback">Continue on web</a>
  <script>
    (function () {
      var DEFAULT_SCHEME = 'com.despia.vybe';
      var EXCHANGE_URL = 'https://us-central1-vybe-daaab.cloudfunctions.net/authQr';
      var WEB_FALLBACK = 'https://vybehub.app/auth/callback';

      function setStatus(text) {
        var el = document.getElementById('status');
        if (el) el.textContent = text;
      }

      function decodeState(state) {
        if (!state) return null;
        try {
          var padded = state.replace(/-/g, '+').replace(/_/g, '/');
          while (padded.length % 4) padded += '=';
          return JSON.parse(atob(padded));
        } catch (e) {
          return null;
        }
      }

      function getParams() {
        var params = new URLSearchParams(window.location.search);
        if (window.location.hash && window.location.hash.length > 1) {
          var hash = window.location.hash.charAt(0) === '#' ? window.location.hash.slice(1) : window.location.hash;
          new URLSearchParams(hash).forEach(function (value, key) {
            params.set(key, value);
          });
        }
        return params;
      }

      function buildDeeplink(scheme, query) {
        var cleanScheme = String(scheme || DEFAULT_SCHEME).trim();
        if (!cleanScheme || cleanScheme.indexOf('://') !== -1) cleanScheme = DEFAULT_SCHEME;
        return cleanScheme + '://oauth/auth' + (query ? '?' + query : '');
      }

      function isValidDeeplink(url) {
        if (!url || typeof url !== 'string') return false;
        var value = url.trim();
        if (!value || value === '#' || value === 'vybe:' || value === 'vybe://') return false;
        try {
          var parsed = new URL(value);
          return parsed.protocol === 'com.despia.vybe:' && value.indexOf('oauth') !== -1;
        } catch (e) {
          return false;
        }
      }

      /**
       * Despia requires `{scheme}://oauth/…` and location.href (not replace-only)
       * to close ASWebAuthenticationSession. Never set Open VYBE to an empty/malformed href.
       */
      function redirectToApp(scheme, query) {
        var deeplink = buildDeeplink(scheme, query);
        var openBtn = document.getElementById('openApp');
        var webBtn = document.getElementById('webFallback');

        if (isValidDeeplink(deeplink)) {
          window.__vybeOauthDeeplink = deeplink;
          if (openBtn) openBtn.setAttribute('href', deeplink);
          try {
            window.location.href = deeplink;
          } catch (e) {}
          setTimeout(function () {
            try { window.location.replace(deeplink); } catch (e2) {}
          }, 120);
        } else {
          window.__vybeOauthDeeplink = '';
          if (openBtn) {
            openBtn.removeAttribute('href');
            openBtn.style.display = 'none';
          }
        }

        setTimeout(function () {
          if (webBtn) {
            webBtn.style.display = 'inline-block';
            webBtn.setAttribute('href', WEB_FALLBACK);
          }
          if (isValidDeeplink(window.__vybeOauthDeeplink) && openBtn) {
            openBtn.style.display = 'inline-block';
            setStatus('Tap below if VYBE did not open.');
          } else {
            setStatus('Continue in the browser if the app did not open.');
          }
        }, 800);
      }

      document.getElementById('openApp').addEventListener('click', function (ev) {
        if (!isValidDeeplink(window.__vybeOauthDeeplink)) {
          ev.preventDefault();
          return;
        }
        ev.preventDefault();
        window.location.href = window.__vybeOauthDeeplink;
      });

      var params = getParams();
      var stateObj = decodeState(params.get('state'));
      var scheme = (stateObj && stateObj.scheme) || DEFAULT_SCHEME;
      var idToken = params.get('id_token');
      var code = params.get('code');
      var error = params.get('error');
      var state = params.get('state') || '';
      var provider = (stateObj && stateObj.provider) || 'google';

      if (error) {
        var errQuery = 'error=' + encodeURIComponent(error) + '&state=' + encodeURIComponent(state);
        var errDesc = params.get('error_description');
        if (errDesc) errQuery += '&error_description=' + encodeURIComponent(errDesc);
        redirectToApp(scheme, errQuery);
        return;
      }

      // Apple returns id_token (and optional code) — hand straight to app.
      if (provider === 'apple' && idToken) {
        var appleQuery =
          'id_token=' +
          encodeURIComponent(idToken) +
          '&state=' +
          encodeURIComponent(state) +
          (code ? '&code=' + encodeURIComponent(code) : '');
        redirectToApp(scheme, appleQuery);
        return;
      }

      if (!idToken) {
        redirectToApp(scheme, 'error=missing_token&state=' + encodeURIComponent(state));
        return;
      }

      setStatus('Finishing Google sign-in…');

      fetch(EXCHANGE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: { action: 'exchange_google', idToken: idToken } }),
      })
        .then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        })
        .then(function (result) {
          var payload = (result.data && result.data.result) || result.data || {};
          var token = payload.customToken || payload.custom_token;
          if (!result.ok || !token) {
            var errMsg =
              (result.data && result.data.error && result.data.error.message) ||
              payload.message ||
              payload.error ||
              'exchange_failed';
            throw new Error(errMsg);
          }
          var okQuery =
            'custom_token=' + encodeURIComponent(token) + '&state=' + encodeURIComponent(state);
          redirectToApp(scheme, okQuery);
        })
        .catch(function () {
          setStatus('Could not finish automatically. Opening app…');
          var fallbackQuery =
            'id_token=' +
            encodeURIComponent(idToken) +
            '&state=' +
            encodeURIComponent(state);
          redirectToApp(scheme, fallbackQuery);
        });
    })();
  </script>
</body>
</html>
