<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0B0B10; }
  </style>
</head>
<body>
  <script>
    /**
     * Despia OAuth return (Google/Apple). Runs inside ASWeb / Custom Tabs.
     * iOS: close via HTTPS 302 (/oauth-dismiss → custom scheme) so ASWeb
     * dismisses. Direct com.despia.vybe:// from JS opens Safari and sticks.
     * Android: App Link close (CCT); oauth/ deeplink as secondary.
     */
    (function () {
      var DEFAULT_SCHEME = 'com.despia.vybe';
      var EXCHANGE_URL = 'https://us-central1-vybe-daaab.cloudfunctions.net/authQr';
      var APP_ORIGIN = 'https://vybehub.app';
      // Direct Cloud Function URL — vybehub.app is Lovable and does not serve the
      // Firebase Hosting rewrite for /oauth-dismiss (would return SPA 200 instead of 302).
      var DISMISS_URL = 'https://us-central1-vybe-daaab.cloudfunctions.net/oauthDismiss';
      var closed = false;
      var softFired = false;

      // #region agent log
      function dbg(hypothesisId, message, data) {
        try {
          fetch(EXCHANGE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              data: {
                action: 'debug_oauth',
                event: message,
                hypothesisId: hypothesisId,
                location: 'native-callback.html',
                payload: data || {},
              },
            }),
            keepalive: true,
          }).catch(function () {});
        } catch (e1) {}
      }
      // #endregion

      function decodeState(state) {
        if (!state) return null;
        try {
          var padded = state.replace(/-/g, '+').replace(/_/g, '/');
          while (padded.length % 4) padded += '=';
          return JSON.parse(atob(padded));
        } catch (e) {
          return null;
        }
      }

      function getParams() {
        var params = new URLSearchParams(window.location.search);
        if (window.location.hash && window.location.hash.length > 1) {
          var hash = window.location.hash.charAt(0) === '#' ? window.location.hash.slice(1) : window.location.hash;
          new URLSearchParams(hash).forEach(function (value, key) {
            params.set(key, value);
          });
        }
        return params;
      }

      function isAndroid() {
        return /Android/i.test(navigator.userAgent || '');
      }

      function callAuthQr(payload) {
        return fetch(EXCHANGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: payload }),
          keepalive: true,
        }).then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        });
      }

      function payloadOf(result) {
        return (result.data && result.data.result) || result.data || {};
      }

      function errMsgOf(result) {
        var d = result && result.data;
        if (!d) return null;
        if (d.error) {
          if (typeof d.error === 'string') return d.error;
          if (d.error.message) return String(d.error.message);
          return JSON.stringify(d.error).slice(0, 120);
        }
        if (d.message) return String(d.message);
        return null;
      }

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') closed = true;
      });
      window.addEventListener('pagehide', function () {
        closed = true;
      });

      var params = getParams();
      var stateObj = decodeState(params.get('state'));
      var idToken = params.get('id_token');
      var error = params.get('error');
      var provider = (stateObj && stateObj.provider) || 'google';
      var nonce = (stateObj && stateObj.nonce) || '';
      var intent = (stateObj && stateObj.intent) || 'signin';
      var scheme = DEFAULT_SCHEME;
      if (stateObj && stateObj.scheme) {
        var s = String(stateObj.scheme).trim();
        if (s && s.indexOf('://') === -1) scheme = s;
      }

      // Apple JS popup leftover: close immediately so Face ID isn't buried under a blank sheet.
      if (window.opener && !window.opener.closed) {
        try { window.close(); } catch (e0) {}
      }

      function fireClose(query) {
        if (!query || closed) return;
        // Prefer closing popup windows first (Apple JS usePopup leftovers).
        try {
          if (window.opener) {
            window.close();
            closed = true;
            return;
          }
        } catch (eClose) {}
        // #region agent log
        dbg('A', 'fire_close', {
          android: isAndroid(),
          queryLen: query.length,
          hasHc: query.indexOf('hc=') !== -1,
          hasWait: query.indexOf('wait=') !== -1,
          provider: provider,
          intent: intent,
          mode: isAndroid() ? 'applink' : 'https-302',
        });
        // #endregion
        if (isAndroid()) {
          // CCT closes reliably on HTTPS App Link into the app.
          var appLink = APP_ORIGIN + '/auth?' + query;
          try { window.location.replace(appLink); } catch (e1) {}
          try { window.location.href = appLink; } catch (e2) {}
          return;
        }
        // iOS ASWeb: staged close attempts. Despia docs say direct JS
        // {scheme}://oauth/... is the close signal — custom-scheme navigations
        // never unload this page, so we can chain fallbacks and log which one
        // actually dismissed the sheet (pagehide/visibility sets `closed`).
        var deeplinkA = scheme + '://oauth/auth?' + query;
        var deeplinkB = 'vybe://oauth/auth?' + query;
        var dismiss =
          DISMISS_URL +
          '?' +
          query +
          '&scheme=' +
          encodeURIComponent(scheme);
        // #region agent log
        dbg('S', 'ios_close_stage1_js_scheme', { scheme: scheme });
        // #endregion
        try { window.location.href = deeplinkA; } catch (e3) {}
        setTimeout(function () {
          if (closed) return;
          // #region agent log
          dbg('S', 'ios_close_stage2_js_vybe', { stage1Closed: false });
          // #endregion
          try { window.location.href = deeplinkB; } catch (e4) {}
        }, 1200);
        setTimeout(function () {
          if (closed) return;
          // #region agent log
          dbg('S', 'ios_close_stage3_https302', { stage2Closed: false });
          // #endregion
          try { window.location.replace(dismiss); } catch (e5) {}
        }, 2400);
        setTimeout(function () {
          if (closed) return;
          // #region agent log
          dbg('S', 'ios_close_all_failed', { scheme: scheme });
          // #endregion
        }, 4200);
      }

      // #region agent log
      dbg('B', 'callback_boot', {
        hasIdToken: Boolean(idToken),
        idTokenLen: idToken ? String(idToken).length : 0,
        provider: provider,
        intent: intent,
        hasError: Boolean(error),
        android: isAndroid(),
        hasNonce: Boolean(nonce),
        softFired: softFired,
        dismissMode: isAndroid() ? 'applink' : 'oauthDismiss-302',
      });
      // #endregion

      if (error) {
        fireClose('error=' + encodeURIComponent(String(error).slice(0, 64)));
        return;
      }

      if (!idToken) {
        fireClose('error=missing_token');
        return;
      }

      // Exchange FIRST, then close carrying hc=. Never navigate before the
      // exchange responds — runtime dump proved early soft-close kills the
      // keepalive fetch (no exchange_result), so no handoff is stashed and the
      // in-app nonce poll never resolves (user stuck logged out).
      var stashPromise =
        provider === 'apple'
          ? callAuthQr({
              action: 'exchange_apple',
              idToken: idToken,
              nonce: nonce,
            })
          : callAuthQr({ action: 'exchange_google', idToken: idToken, nonce: nonce });

      // Safety net: if the exchange hangs >6s, close with the nonce-wait path
      // so the user is never stuck staring at a blank sheet.
      var slowTimer = setTimeout(function () {
        if (closed) return;
        softFired = true;
        var softQ =
          'nonce=' +
          encodeURIComponent(nonce) +
          '&wait=1&provider=' +
          encodeURIComponent(provider);
        if (intent === 'link') softQ += '&intent=link';
        fireClose(softQ);
      }, 6000);

      stashPromise
        .then(function (result) {
          clearTimeout(slowTimer);
          var payload = payloadOf(result);
          var handoff = payload.code;
          // #region agent log
          dbg('B', 'exchange_result', {
            ok: Boolean(result.ok),
            hasHandoff: Boolean(handoff),
            handoffLen: handoff ? String(handoff).length : 0,
            provider: provider,
            intent: intent,
            errMsg: errMsgOf(result),
          });
          // #endregion
          if (!result.ok || !handoff) throw new Error(errMsgOf(result) || 'exchange_failed');
          var q = 'hc=' + encodeURIComponent(handoff);
          if (intent === 'link') q += '&intent=link';
          if (!closed) fireClose(q);
        })
        .catch(function (err) {
          clearTimeout(slowTimer);
          // #region agent log
          dbg('B', 'exchange_failed', {
            provider: provider,
            intent: intent,
            msg: err && err.message ? String(err.message).slice(0, 120) : 'fail',
          });
          // #endregion
          if (!closed) fireClose('error=exchange_failed');
        });
    })();
  </script>
</body>
</html>
