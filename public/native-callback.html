<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0B0B10; }
  </style>
</head>
<body>
  <script>
    /**
     * LEGACY — Despia ASWebAuthenticationSession / Chrome Custom Tabs OAuth return only.
     *
     * FORBIDDEN when feature flag `native_ios_auth_v1` is ON and the Despia
     * nativeauth:// bridge is available. That path uses AuthenticationServices /
     * GIDSignIn → signInWithCredential in the main WebView and must NEVER open
     * this page, call oauthDismiss, or run exchange_*.
     *
     * Despia OAuth return (Google/Apple). Runs inside ASWeb / Custom Tabs.
     * iOS: Despia closes ASWeb on top-level `{scheme}://oauth/…` (docs).
     *   Custom-scheme nav often does NOT unload this page — so we stage:
     *   1) JS scheme://oauth/auth?hc=  2) retry  3) same-origin oauth-close.html
     *   4) HTTPS oauthDismiss 302. Never mark closed until pagehide/visibility.
     *   No wait=1 soft-close on success (toast + sticky sheet). Exchange-first.
     * Android: App Link close (CCT) only.
     * If exchange hangs: leave blank page (or "Open VYBE" App Link UI after success).
     */
    (function () {
      var DEFAULT_SCHEME = 'com.despia.vybe';
      var EXCHANGE_URL = 'https://us-central1-vybe-daaab.cloudfunctions.net/authQr';
      var APP_ORIGIN = 'https://vybehub.app';
      // Direct Cloud Function URL — vybehub.app is Lovable and does not serve the
      // Firebase Hosting rewrite for /oauth-dismiss (would return SPA 200 instead of 302).
      var DISMISS_URL = 'https://us-central1-vybe-daaab.cloudfunctions.net/oauthDismiss';
      var INGEST_URL = 'http://127.0.0.1:7693/ingest/1847f3ab-7d03-4b99-8dbe-84076ae9145e';
      var DEBUG_SESSION = 'bd2545';
      var DEBUG_RUN = 'ios-oauth-timeline';
      var closed = false;
      var bootAt = Date.now();
      var fireCloseCalled = false;
      var oauthDismissNavCalled = false;

      function decodeState(state) {
        if (!state) return null;
        try {
          var padded = state.replace(/-/g, '+').replace(/_/g, '/');
          while (padded.length % 4) padded += '=';
          return JSON.parse(atob(padded));
        } catch (e) {
          return null;
        }
      }

      /** Despia oauth:// state must include scheme + nonce + provider (same as decodeOAuthState). */
      function hasValidDespiaOAuthState(obj) {
        if (!obj || typeof obj !== 'object') return false;
        return !!(obj.scheme && obj.nonce && obj.provider);
      }

      function getParams() {
        var params = new URLSearchParams(window.location.search);
        if (window.location.hash && window.location.hash.length > 1) {
          var hash = window.location.hash.charAt(0) === '#' ? window.location.hash.slice(1) : window.location.hash;
          new URLSearchParams(hash).forEach(function (value, key) {
            params.set(key, value);
          });
        }
        return params;
      }

      function isAndroid() {
        return /Android/i.test(navigator.userAgent || '');
      }

      function callAuthQr(payload) {
        return fetch(EXCHANGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: payload }),
          keepalive: true,
        }).then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        });
      }

      function payloadOf(result) {
        return (result.data && result.data.result) || result.data || {};
      }

      function errMsgOf(result) {
        var d = result && result.data;
        if (!d) return null;
        if (d.error) {
          if (typeof d.error === 'string') return d.error;
          if (d.error.message) return String(d.error.message);
          return JSON.stringify(d.error).slice(0, 120);
        }
        if (d.message) return String(d.message);
        return null;
      }

      /** Detect Apple JWT when despia state is missing (WKWebView Apple redirect). */
      function idTokenIss(token) {
        if (!token || token.indexOf('.') < 0) return '';
        try {
          var mid = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
          while (mid.length % 4) mid += '=';
          var payload = JSON.parse(atob(mid));
          return payload && payload.iss ? String(payload.iss) : '';
        } catch (eIss) {
          return '';
        }
      }

      function issHost(iss) {
        if (!iss) return '';
        try {
          if (String(iss).indexOf('://') !== -1) return new URL(iss).hostname.slice(0, 64);
          return String(iss).slice(0, 64);
        } catch (eH) {
          return String(iss).slice(0, 40);
        }
      }

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') closed = true;
      });
      window.addEventListener('pagehide', function () {
        closed = true;
      });

      var params = getParams();
      var stateRaw = params.get('state') || '';
      var stateObj = decodeState(stateRaw);
      var idToken = params.get('id_token');
      var authCode = params.get('code') || '';
      var cv = (stateObj && stateObj.cv) || '';
      var error = params.get('error');
      var provider = (stateObj && stateObj.provider) || 'google';
      var nonce = (stateObj && stateObj.nonce) || '';
      var intent = (stateObj && stateObj.intent) || 'signin';
      var scheme = DEFAULT_SCHEME;
      if (stateObj && stateObj.scheme) {
        var s = String(stateObj.scheme).trim();
        if (s && s.indexOf('://') === -1) scheme = s;
      }

      var tokenIss = idTokenIss(idToken);
      if (tokenIss.indexOf('appleid.apple.com') !== -1) {
        provider = 'apple';
      }

      var hasOpener = !!(window.opener && !window.opener.closed);
      var callbackPath = '';
      try {
        callbackPath = window.location.origin + window.location.pathname;
      } catch (ePath) {
        callbackPath = '/native-callback.html';
      }

      // #region agent log
      function dbg(event, hypothesisId, payload) {
        var bodyPayload = Object.assign(
          {
            runId: DEBUG_RUN,
            sessionId: DEBUG_SESSION,
            callbackPath: callbackPath,
            provider: provider,
            hasState: !!stateRaw,
            stateLen: stateRaw ? String(stateRaw).length : 0,
            iss: issHost(tokenIss),
            hasOpener: hasOpener,
            fireCloseCalled: fireCloseCalled,
            oauthDismissNavCalled: oauthDismissNavCalled,
          },
          payload || {},
        );
        try {
          fetch(INGEST_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Debug-Session-Id': DEBUG_SESSION,
            },
            body: JSON.stringify({
              sessionId: DEBUG_SESSION,
              runId: DEBUG_RUN,
              hypothesisId: hypothesisId || 'T',
              location: 'native-callback.html',
              message: event,
              data: bodyPayload,
              timestamp: Date.now(),
            }),
          }).catch(function () {});
        } catch (eIngest) {}
        try {
          fetch(EXCHANGE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              data: {
                action: 'debug_oauth',
                event: event,
                hypothesisId: hypothesisId || 'T',
                location: 'native-callback.html',
                payload: bodyPayload,
              },
            }),
            keepalive: true,
          }).catch(function () {});
        } catch (eDbg) {}
      }
      // #endregion

      // Apple JS popup (usePopup): tokens return via postMessage to opener.
      // NEVER run Despia oauthDismiss in this window — that 302s to a custom
      // scheme inside the popup and shows Safari "address is invalid".
      if (hasOpener) {
        // #region agent log
        dbg('callback_boot', 'T', {
          earlyReturnOpener: true,
          hasIdToken: !!idToken,
          idTokenLen: idToken ? String(idToken).length : 0,
          hasCode: !!authCode,
          hasError: !!error,
          exchangeAction: 'none',
        });
        dbg('apple_popup_early_return', 'F', {
          hasIdToken: !!idToken,
          hasError: !!error,
        });
        // #endregion
        try { window.close(); } catch (e0) {}
        return;
      }

      // [iOS-only] Apple JWT without Despia oauth:// state (Apple JS redirect /
      // WKWebView residue) — close quietly; do not exchange or oauthDismiss.
      // Android Apple oauth:// with valid Despia state still exchanges below.
      var validDespiaState = hasValidDespiaOAuthState(stateObj);
      if (
        !isAndroid() &&
        tokenIss.indexOf('appleid.apple.com') !== -1 &&
        !validDespiaState
      ) {
        // #region agent log
        dbg('callback_boot', 'T', {
          earlyReturnAppleNoDespiaState: true,
          hasIdToken: !!idToken,
          idTokenLen: idToken ? String(idToken).length : 0,
          hasCode: !!authCode,
          hasError: !!error,
          hasState: !!stateRaw,
          validDespiaState: false,
          exchangeAction: 'none',
        });
        dbg('apple_no_despia_state_early_return', 'F', {
          hasIdToken: !!idToken,
          hasError: !!error,
          hasState: !!stateRaw,
        });
        // #endregion
        try { window.close(); } catch (eAppleClose) {}
        return;
      }

      // Select exchange action (logged before fireClose).
      var exchangeAction = 'none';
      if (error) {
        exchangeAction = 'none';
      } else if (authCode && cv) {
        exchangeAction = 'exchange_google_code';
      } else if (!idToken) {
        exchangeAction = 'none';
      } else if (provider === 'apple') {
        exchangeAction = 'exchange_apple';
      } else {
        exchangeAction = 'exchange_google';
      }

      // #region agent log
      dbg('callback_boot', 'T', {
        hasIdToken: !!idToken,
        idTokenLen: idToken ? String(idToken).length : 0,
        hasCode: !!authCode,
        hasCv: !!cv,
        intent: intent,
        hasError: !!error,
        android: isAndroid(),
        noncePresent: !!nonce,
        validDespiaState: validDespiaState,
        scheme: scheme,
        dismissMode: isAndroid() ? 'applink' : 'ios_staged',
        exchangeAction: exchangeAction,
      });
      dbg('exchange_selected', 'T', {
        exchangeAction: exchangeAction,
        provider: provider,
        iss: issHost(tokenIss),
      });
      // #endregion

      function fireClose(query) {
        if (!query || closed || fireCloseCalled) return;
        fireCloseCalled = true;
        try {
          if (window.opener) {
            // #region agent log
            dbg('fire_close', 'T', {
              mode: 'opener_close',
              hasHc: String(query).indexOf('hc=') !== -1,
              hasWait: String(query).indexOf('wait=') !== -1,
              queryLen: String(query).length,
            });
            // #endregion
            window.close();
            closed = true;
            return;
          }
        } catch (eClose) {}
        if (isAndroid()) {
          // [Android-only] App Link close — CCT returns via HTTPS /auth?hc=
          var appLink = APP_ORIGIN + '/auth?' + query;
          // #region agent log
          dbg('fire_close', 'T', {
            mode: 'applink',
            android: true,
            hasHc: query.indexOf('hc=') !== -1,
            hasWait: query.indexOf('wait=') !== -1,
            queryLen: String(query).length,
            intent: intent,
          });
          // #endregion
          closed = true;
          try { window.location.replace(appLink); } catch (e1) {}
          try { window.location.href = appLink; } catch (e2) {}
          return;
        }
        // [iOS-only] Staged close — Despia docs: `{scheme}://oauth/…` is the
        // ASWeb dismiss signal. Custom-scheme nav often does not unload this
        // page, so we can chain fallbacks. Do NOT set closed=true here (only
        // pagehide/visibility). oauthDismiss-only was hitting CF 302 but leaving
        // the sheet stuck (prod evidence 2026-07-17). Never wait=1 / warm=1.
        var deeplink = scheme + '://oauth/auth?' + query;
        var sameOriginClose =
          APP_ORIGIN +
          '/oauth-close.html?' +
          query +
          '&scheme=' +
          encodeURIComponent(scheme);
        var dismiss =
          DISMISS_URL +
          '?' +
          query +
          '&scheme=' +
          encodeURIComponent(scheme) +
          '&format=html';
        // #region agent log
        dbg('fire_close', 'T', {
          mode: 'ios_staged',
          android: false,
          hasHc: query.indexOf('hc=') !== -1,
          hasWait: query.indexOf('wait=') !== -1,
          queryLen: String(query).length,
          intent: intent,
          scheme: scheme,
          msSinceBoot: Date.now() - bootAt,
        });
        // #endregion

        function tryJsScheme(stage) {
          if (closed) return;
          // #region agent log
          dbg('ios_close_stage', 'T', {
            stage: stage,
            scheme: scheme,
            hasHc: query.indexOf('hc=') !== -1,
            msSinceBoot: Date.now() - bootAt,
          });
          // #endregion
          try { window.location.href = deeplink; } catch (eJs1) {}
          try {
            var a = document.createElement('a');
            a.href = deeplink;
            a.rel = 'noopener';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(function () {
              try { a.remove(); } catch (eRm) {}
            }, 0);
          } catch (eJs2) {}
        }

        tryJsScheme('js_scheme');
        setTimeout(function () {
          tryJsScheme('js_scheme_retry');
        }, 100);
        setTimeout(function () {
          if (closed) return;
          // #region agent log
          dbg('ios_close_stage', 'T', {
            stage: 'same_origin_meta',
            scheme: scheme,
            hasHc: query.indexOf('hc=') !== -1,
            msSinceBoot: Date.now() - bootAt,
          });
          // #endregion
          try { window.location.replace(sameOriginClose); } catch (eSo1) {
            try { window.location.href = sameOriginClose; } catch (eSo2) {}
          }
        }, 220);
        setTimeout(function () {
          if (closed) return;
          oauthDismissNavCalled = true;
          // #region agent log
          dbg('ios_close_stage', 'T', {
            stage: 'oauthDismiss',
            scheme: scheme,
            hasHc: query.indexOf('hc=') !== -1,
            msSinceBoot: Date.now() - bootAt,
          });
          dbg('oauth_dismiss_nav', 'T', {
            dismissHost: 'us-central1-vybe-daaab.cloudfunctions.net',
            hasHc: query.indexOf('hc=') !== -1,
            hasWait: query.indexOf('wait=') !== -1,
            scheme: scheme,
            msSinceBoot: Date.now() - bootAt,
          });
          // #endregion
          try { window.location.replace(dismiss); } catch (e5) {
            try { window.location.href = dismiss; } catch (e6) {}
          }
        }, 400);
      }

      if (error) {
        fireClose('error=' + encodeURIComponent(String(error).slice(0, 64)));
        return;
      }

      // Legacy PKCE builds — exchange if code+cv present (requires client_secret on server).
      // No iOS wait=1 soft-close: if exchange hangs, leave blank page.
      if (authCode && cv) {
        var REDIRECT_URI = APP_ORIGIN + '/native-callback.html';
        callAuthQr({
          action: 'exchange_google_code',
          code: authCode,
          codeVerifier: cv,
          redirectUri: REDIRECT_URI,
          nonce: nonce,
        })
          .then(function (result) {
            var payload = payloadOf(result);
            var handoff = payload.code;
            if (!result.ok || !handoff) throw new Error(errMsgOf(result) || 'exchange_failed');
            var q = 'hc=' + encodeURIComponent(handoff);
            if (intent === 'link') q += '&intent=link';
            if (!closed) fireClose(q);
          })
          .catch(function () {
            if (!closed) fireClose('error=exchange_failed');
          });
        return;
      }

      if (!idToken) {
        fireClose('error=missing_token');
        return;
      }

      // Exchange-first then single close with hc= (proven iOS path).
      // Do NOT soft-close with wait=1 — that caused Safari "address is invalid"
      // and stuck ASWeb. If exchange hangs, leave blank / Open VYBE UI only after hc=.
      var stashPromise =
        provider === 'apple'
          ? callAuthQr({
              action: 'exchange_apple',
              idToken: idToken,
              nonce: nonce,
            })
          : callAuthQr({ action: 'exchange_google', idToken: idToken, nonce: nonce });

      stashPromise
        .then(function (result) {
          var payload = payloadOf(result);
          var handoff = payload.code;
          if (!result.ok || !handoff) throw new Error(errMsgOf(result) || 'exchange_failed');
          var q = 'hc=' + encodeURIComponent(handoff);
          if (intent === 'link') q += '&intent=link';
          // #region agent log
          dbg('exchange_result', 'T', {
            ok: true,
            hasHandoff: true,
            handoffLen: String(handoff).length,
            intent: intent,
            alreadyClosed: closed,
            msSinceBoot: Date.now() - bootAt,
            exchangeAction: exchangeAction,
          });
          // #endregion
          if (!closed) fireClose(q);
          setTimeout(function () {
            if (closed) return;
            try {
              var openHref = APP_ORIGIN + '/auth?' + q;
              document.body.innerHTML =
                '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;font-family:-apple-system,system-ui,sans-serif;background:#0B0B10;color:#fafafa;text-align:center">' +
                '<div style="font-weight:700;letter-spacing:.12em">VYBE</div>' +
                '<div style="opacity:.7;font-size:13px">Tap to finish signing in</div>' +
                '<a href="' +
                openHref +
                '" style="display:inline-block;margin-top:8px;padding:12px 18px;border-radius:999px;background:#fff;color:#0B0B10;font-weight:600;text-decoration:none">Open VYBE</a>' +
                '</div>';
            } catch (eUi) {}
          }, 1800);
        })
        .catch(function () {
          // #region agent log
          dbg('exchange_result', 'T', {
            ok: false,
            hasHandoff: false,
            intent: intent,
            alreadyClosed: closed,
            msSinceBoot: Date.now() - bootAt,
            exchangeAction: exchangeAction,
          });
          // #endregion
          if (!closed) fireClose('error=exchange_failed');
        });
    })();
  </script>
</body>
</html>
