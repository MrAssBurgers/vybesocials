<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0B0B10; }
  </style>
</head>
<body>
  <script>
    /**
     * https://vybehub.app/native-callback.html — Despia Google/Apple return.
     * Exchanges id_token for a short hc= handoff, then closes the secure browser:
     * - Android: HTTPS App Link to /auth?hc=… (Custom Tabs ignore custom-scheme / intent://)
     * - iOS: com.despia.vybe://oauth/auth?hc=…
     */
    (function () {
      var DEFAULT_SCHEME = 'com.despia.vybe';
      var EXCHANGE_URL = 'https://us-central1-vybe-daaab.cloudfunctions.net/authQr';
      var closed = false;

      function decodeState(state) {
        if (!state) return null;
        try {
          var padded = state.replace(/-/g, '+').replace(/_/g, '/');
          while (padded.length % 4) padded += '=';
          return JSON.parse(atob(padded));
        } catch (e) {
          return null;
        }
      }

      function getParams() {
        var params = new URLSearchParams(window.location.search);
        if (window.location.hash && window.location.hash.length > 1) {
          var hash = window.location.hash.charAt(0) === '#' ? window.location.hash.slice(1) : window.location.hash;
          new URLSearchParams(hash).forEach(function (value, key) {
            params.set(key, value);
          });
        }
        return params;
      }

      function buildDeeplink(scheme, query) {
        var clean = String(scheme || DEFAULT_SCHEME).trim();
        if (!clean || clean.indexOf('://') !== -1) clean = DEFAULT_SCHEME;
        return clean + '://oauth/auth?' + query;
      }

      function isAndroid() {
        return /Android/i.test(navigator.userAgent || '');
      }

      function softFire(deeplink) {
        if (!deeplink || deeplink.indexOf('oauth') === -1) return;
        // Android CCT: never soft-fire custom-scheme / intent:// — they error or stay open.
        if (isAndroid()) return;
        try {
          var iframe = document.createElement('iframe');
          iframe.setAttribute('aria-hidden', 'true');
          iframe.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden';
          iframe.src = deeplink;
          document.body.appendChild(iframe);
          setTimeout(function () {
            try { iframe.remove(); } catch (e) {}
          }, 600);
        } catch (e1) {}
        try {
          var a = document.createElement('a');
          a.href = deeplink;
          a.rel = 'noopener';
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          setTimeout(function () {
            try { a.remove(); } catch (e2) {}
          }, 100);
        } catch (e3) {}
      }

      function hardFire(deeplink) {
        if (!deeplink || deeplink.indexOf('oauth') === -1) return;

        // Android: App Link only — custom-scheme / intent:// leave CCT open or ERR_UNKNOWN_URL_SCHEME.
        if (isAndroid()) {
          try {
            var q = deeplink.split('?')[1] || '';
            var appLink = 'https://vybehub.app/auth?' + q;
            try { window.location.replace(appLink); } catch (eA1) {}
            try { window.location.href = appLink; } catch (eA2) {}
          } catch (eA0) {}
          return;
        }

        softFire(deeplink);
        try { window.location.replace(deeplink); } catch (e1) {}
        try { window.location.href = deeplink; } catch (e2) {}
        try { window.close(); } catch (e4) {}
      }

      function callAuthQr(payload) {
        return fetch(EXCHANGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: payload }),
          keepalive: true,
        }).then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        });
      }

      function payloadOf(result) {
        return (result.data && result.data.result) || result.data || {};
      }

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') closed = true;
      });
      window.addEventListener('pagehide', function () {
        closed = true;
      });

      var params = getParams();
      var stateObj = decodeState(params.get('state'));
      var scheme = (stateObj && stateObj.scheme) || DEFAULT_SCHEME;
      var idToken = params.get('id_token');
      var error = params.get('error');
      var provider = (stateObj && stateObj.provider) || 'google';
      var nonce = (stateObj && stateObj.nonce) || '';

      if (error) {
        hardFire(buildDeeplink(scheme, 'error=' + encodeURIComponent(String(error).slice(0, 64))));
        return;
      }

      if (!idToken) {
        hardFire(buildDeeplink(scheme, 'error=missing_token'));
        return;
      }

      if (nonce) {
        softFire(
          buildDeeplink(
            scheme,
            'nonce=' + encodeURIComponent(nonce) + '&wait=1&provider=' + encodeURIComponent(provider),
          ),
        );
      }

      var stashPromise =
        provider === 'apple'
          ? callAuthQr({
              action: 'exchange_apple',
              idToken: idToken,
              nonce: nonce,
            })
          : callAuthQr({ action: 'exchange_google', idToken: idToken, nonce: nonce });

      stashPromise
        .then(function (result) {
          var payload = payloadOf(result);
          var handoff = payload.code;
          if (!result.ok || !handoff) throw new Error('exchange_failed');
          var link = buildDeeplink(scheme, 'hc=' + encodeURIComponent(handoff));
          if (!closed) {
            hardFire(link);
            // iOS may need a short retry; Android App Link must fire once only.
            if (!isAndroid()) {
              setTimeout(function () {
                if (!closed) hardFire(link);
              }, 80);
              setTimeout(function () {
                if (!closed) hardFire(link);
              }, 250);
            }
          }
        })
        .catch(function () {
          if (!closed) hardFire(buildDeeplink(scheme, 'error=exchange_failed'));
        });
    })();
  </script>
</body>
</html>
