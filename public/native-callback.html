<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0B0B10; }
  </style>
</head>
<body>
  <script>
    /**
     * https://vybehub.app/native-callback.html — Despia Google/Apple return.
     *
     * Goal: close Custom Tab / ASWeb as soon as account is picked, without a
     * "VYBE" interstitial. App WebView already polls by nonce.
     *
     *  1) Soft-fire wait=1 (iframe / <a> / intent) — does NOT top-level navigate
     *     so the exchange fetch stays alive
     *  2) Exchange id_token → short hc= (keepalive)
     *  3) Hard-fire hc= with location.href so Despia closes the sheet
     */
    (function () {
      var DEFAULT_SCHEME = 'com.despia.vybe';
      var PACKAGE_NAME = 'com.despia.vybe';
      var EXCHANGE_URL = 'https://us-central1-vybe-daaab.cloudfunctions.net/authQr';
      var closed = false;

      function decodeState(state) {
        if (!state) return null;
        try {
          var padded = state.replace(/-/g, '+').replace(/_/g, '/');
          while (padded.length % 4) padded += '=';
          return JSON.parse(atob(padded));
        } catch (e) {
          return null;
        }
      }

      function getParams() {
        var params = new URLSearchParams(window.location.search);
        if (window.location.hash && window.location.hash.length > 1) {
          var hash = window.location.hash.charAt(0) === '#' ? window.location.hash.slice(1) : window.location.hash;
          new URLSearchParams(hash).forEach(function (value, key) {
            params.set(key, value);
          });
        }
        return params;
      }

      function buildDeeplink(scheme, query) {
        var clean = String(scheme || DEFAULT_SCHEME).trim();
        if (!clean || clean.indexOf('://') !== -1) clean = DEFAULT_SCHEME;
        return clean + '://oauth/auth?' + query;
      }

      function buildAndroidIntentUrl(deeplink) {
        try {
          var parsed = new URL(deeplink);
          var scheme = String(parsed.protocol || '').replace(/:$/, '');
          if (!scheme || scheme === 'http' || scheme === 'https') return null;
          var path = (parsed.hostname || '') + (parsed.pathname || '');
          if (path.charAt(0) === '/') path = path.slice(1);
          var query = parsed.search ? parsed.search.slice(1) : '';
          return (
            'intent://' +
            path +
            (query ? '?' + query : '') +
            '#Intent;scheme=' +
            encodeURIComponent(scheme) +
            ';package=' +
            encodeURIComponent(PACKAGE_NAME) +
            ';end'
          );
        } catch (e) {
          return null;
        }
      }

      function isAndroid() {
        return /Android/i.test(navigator.userAgent || '');
      }

      /** Soft close — keep this document alive for fetch. */
      function softFire(deeplink) {
        if (!deeplink || deeplink.indexOf('oauth') === -1) return;
        try {
          var iframe = document.createElement('iframe');
          iframe.setAttribute('aria-hidden', 'true');
          iframe.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden';
          iframe.src = deeplink;
          document.body.appendChild(iframe);
          setTimeout(function () {
            try { iframe.remove(); } catch (e) {}
          }, 600);
        } catch (e1) {}
        try {
          var a = document.createElement('a');
          a.href = deeplink;
          a.rel = 'noopener';
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          setTimeout(function () {
            try { a.remove(); } catch (e2) {}
          }, 100);
        } catch (e3) {}
        if (isAndroid()) {
          var intentUrl = buildAndroidIntentUrl(deeplink);
          if (intentUrl) {
            try {
              var ai = document.createElement('a');
              ai.href = intentUrl;
              ai.style.display = 'none';
              document.body.appendChild(ai);
              ai.click();
              setTimeout(function () {
                try { ai.remove(); } catch (e4) {}
              }, 100);
            } catch (e5) {}
          }
        }
      }

      /** Hard close — Despia official signal. */
      function hardFire(deeplink) {
        if (!deeplink || deeplink.indexOf('oauth') === -1) return;
        softFire(deeplink);
        try { window.location.replace(deeplink); } catch (e1) {}
        try { window.location.href = deeplink; } catch (e2) {}
        if (isAndroid()) {
          var intentUrl = buildAndroidIntentUrl(deeplink);
          if (intentUrl) {
            try { window.location.href = intentUrl; } catch (e3) {}
          }
        }
        try { window.close(); } catch (e4) {}
      }

      function callAuthQr(payload) {
        return fetch(EXCHANGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: payload }),
          keepalive: true,
        }).then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        });
      }

      function payloadOf(result) {
        return (result.data && result.data.result) || result.data || {};
      }

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') closed = true;
      });
      window.addEventListener('pagehide', function () { closed = true; });

      var params = getParams();
      var stateObj = decodeState(params.get('state'));
      var scheme = (stateObj && stateObj.scheme) || DEFAULT_SCHEME;
      var idToken = params.get('id_token');
      var error = params.get('error');
      var provider = (stateObj && stateObj.provider) || 'google';
      var nonce = (stateObj && stateObj.nonce) || '';

      if (error) {
        hardFire(buildDeeplink(scheme, 'error=' + encodeURIComponent(String(error).slice(0, 64))));
        return;
      }

      if (!idToken) {
        hardFire(buildDeeplink(scheme, 'error=missing_token'));
        return;
      }

      // Soft-close immediately so the account sheet dismisses while we exchange.
      if (nonce) {
        softFire(
          buildDeeplink(
            scheme,
            'nonce=' + encodeURIComponent(nonce) + '&wait=1&provider=' + encodeURIComponent(provider),
          ),
        );
      }

      var stashPromise =
        provider === 'apple'
          ? callAuthQr({
              action: 'stash_oauth',
              provider: 'apple',
              idToken: idToken,
              nonce: nonce,
            })
          : callAuthQr({ action: 'exchange_google', idToken: idToken, nonce: nonce });

      stashPromise
        .then(function (result) {
          var payload = payloadOf(result);
          var handoff = payload.code;
          if (!result.ok || !handoff) throw new Error('exchange_failed');
          var link = buildDeeplink(scheme, 'hc=' + encodeURIComponent(handoff));
          if (!closed) {
            hardFire(link);
            setTimeout(function () {
              if (!closed) hardFire(link);
            }, 80);
            setTimeout(function () {
              if (!closed) hardFire(link);
            }, 250);
          }
        })
        .catch(function () {
          if (!closed) hardFire(buildDeeplink(scheme, 'error=exchange_failed'));
        });
    })();
  </script>
</body>
</html>
