  <path d="M 170 45 L 120 150" stroke="url(#rg)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="120" cy="150" r="22" fill="#ffffff" fill-opacity="0.9" filter="url(#joint)"/>
