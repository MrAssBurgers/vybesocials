<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYBE — Offline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: 240 10% 4%;
            --fg: 0 0% 98%;
            --primary: 270 95% 65%;
            --accent: 195 100% 50%;
            --glass: 240 10% 14%;
            --muted: 240 5% 46%;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: 0 0% 98%;
                --fg: 240 10% 4%;
                --primary: 270 80% 55%;
                --accent: 195 90% 42%;
                --glass: 240 10% 92%;
                --muted: 240 5% 55%;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: hsl(var(--bg));
            color: hsl(var(--fg));
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Animated gradient orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: hsl(var(--primary) / 0.5);
            top: -80px;
            right: -60px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: hsl(var(--accent) / 0.4);
            bottom: -60px;
            left: -40px;
            animation-delay: -3s;
        }

        .orb-3 {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, hsl(var(--primary) / 0.3), hsl(var(--accent) / 0.3));
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(20px, -30px) scale(1.05); }
            50% { transform: translate(-15px, 15px) scale(0.95); }
            75% { transform: translate(10px, 20px) scale(1.02); }
        }

        /* Glass card */
        .card {
            position: relative;
            z-index: 10;
            max-width: 420px;
            width: 100%;
            text-align: center;
            padding: 3rem 2.5rem;
            border-radius: 24px;
            backdrop-filter: blur(32px) saturate(180%) brightness(1.05);
            -webkit-backdrop-filter: blur(32px) saturate(180%) brightness(1.05);
            background: linear-gradient(
                135deg,
                hsl(var(--glass) / 0.6),
                hsl(var(--glass) / 0.4),
                hsl(var(--glass) / 0.5)
            );
            border: 1px solid hsl(var(--fg) / 0.08);
            box-shadow:
                0 8px 32px hsl(var(--bg) / 0.4),
                0 2px 8px hsl(var(--primary) / 0.08),
                inset 0 1px 0 hsl(var(--fg) / 0.1),
                inset 0 -1px 0 hsl(var(--bg) / 0.2);
        }

        /* Gradient border accent */
        .card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 25px;
            padding: 1px;
            background: linear-gradient(
                180deg,
                hsl(var(--primary) / 0.5),
                transparent 50%,
                hsl(var(--accent) / 0.3)
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Specular highlight */
        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 40%;
            height: 40%;
            background: linear-gradient(
                135deg,
                hsl(var(--fg) / 0.04) 0%,
                transparent 60%
            );
            pointer-events: none;
            border-radius: inherit;
        }

        /* WiFi icon animation */
        .icon-container {
            margin-bottom: 1.5rem;
            position: relative;
            display: inline-block;
        }

        .wifi-icon {
            width: 64px;
            height: 64px;
            color: hsl(var(--primary));
            filter: drop-shadow(0 0 12px hsl(var(--primary) / 0.4));
            animation: pulse-glow 2.5s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 12px hsl(var(--primary) / 0.4)); }
            50% { filter: drop-shadow(0 0 24px hsl(var(--primary) / 0.7)); }
        }

        /* Slash line animated */
        .slash-line {
            stroke: hsl(var(--fg));
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: slash-draw 1.2s ease-out 0.3s forwards;
        }

        @keyframes slash-draw {
            to { stroke-dashoffset: 0; }
        }

        h1 {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, hsl(var(--fg)), hsl(var(--fg) / 0.7));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: hsl(var(--primary));
            margin-bottom: 1rem;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: hsl(var(--muted));
            margin-bottom: 2rem;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        /* CTA Button */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 2rem;
            border: none;
            border-radius: 14px;
            font-family: 'Space Grotesk', system-ui, sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            color: #fff;
            background: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--accent)));
            background-size: 200% 200%;
            animation: gradient-shift 4s ease infinite;
            box-shadow:
                0 4px 16px hsl(var(--primary) / 0.3),
                0 1px 4px hsl(var(--primary) / 0.2);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow:
                0 8px 24px hsl(var(--primary) / 0.4),
                0 2px 8px hsl(var(--primary) / 0.3);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Shimmer sweep */
        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        /* Status dots */
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: hsl(var(--muted));
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: hsl(var(--accent));
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Scanlines (subtle cyber effect) */
        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                hsl(var(--fg) / 0.01) 2px,
                hsl(var(--fg) / 0.01) 4px
            );
        }

        @media (prefers-reduced-motion: reduce) {
            .orb, .wifi-icon, .btn::after, .status-dot {
                animation: none !important;
            }
            .slash-line {
                stroke-dashoffset: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Background effects -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="scanlines"></div>

    <!-- Content -->
    <div class="card">
        <div class="icon-container">
            <svg class="wifi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12.55a11 11 0 0 1 14.08 0" />
                <path d="M1.42 9a16 16 0 0 1 21.16 0" />
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
                <circle cx="12" cy="20" r="1" fill="currentColor" />
                <line class="slash-line" x1="2" y1="2" x2="22" y2="22" stroke-width="2.5" />
            </svg>
        </div>

        <div class="subtitle">Connection Lost</div>
        <h1>You're Offline</h1>
        <p>Check your connection and try again. Your data will sync automatically when you're back online.</p>

        <button class="btn" onclick="window.location.reload()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10" />
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
            </svg>
            Try Again
        </button>

        <div class="status">
            <span class="status-dot"></span>
            Waiting for connection…
        </div>
    </div>

    <script>
        // Auto-reload when back online
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
