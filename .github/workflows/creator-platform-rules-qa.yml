name: Creator Platform Rules QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.qa.json'
      - 'scripts/test-creator-platform-rules.mjs'
      - 'scripts/test-game-capture-post-rules.mjs'
      - 'scripts/test-customization-rules.mjs'
      - 'scripts/test-account-authority-rules.mjs'
      - 'scripts/test-commerce-authority-rules.mjs'
      - 'scripts/test-dm-membership-authority.mjs'
      - 'functions/src/_shared/admin.ts'
      - 'functions/src/_shared/stripe*.ts'
      - 'functions/src/_shared/conversation*.ts'
      - 'functions/src/stripe.ts'
      - 'functions/src/spotify.ts'
      - 'functions/src/dmSend.ts'
      - 'functions/src/calls.ts'
      - 'functions/src/realtime.ts'
      - 'src/lib/dmMembershipRepair*'
      - 'src/hooks/useCreatorProfile*'
      - 'src/hooks/useCommunityVoice*'
      - 'src/hooks/useSharedThemes.ts'
      - 'src/hooks/useUserBackgrounds.ts'
      - 'src/hooks/useCustomTheme.ts'
      - 'src/hooks/useUISettings.ts'
      - 'functions/src/gameIntegration*.ts'
      - 'functions/src/gamePartner*.ts'
      - 'functions/src/_shared/gameCaptureCore.ts'
      - 'functions/src/_shared/gamePartner*.ts'
      - 'functions/src/captureEvents.ts'
      - 'src/lib/gameCapture*.ts'
      - 'src/lib/gameIntegration*.ts'
      - 'src/lib/gamePartner*.ts'
      - 'src/hooks/usePosts.ts'
      - 'src/pages/GameCapture*'
      - 'src/pages/ConnectGame*'
      - 'src/components/settings/GameConnectionsSection*'
      - 'src/pages/MiniApps*'
      - 'src/features/mini-apps/**'
      - 'sdk/game/**'
      - '.github/workflows/creator-platform-rules-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.qa.json'
      - 'scripts/test-creator-platform-rules.mjs'
      - 'scripts/test-game-capture-post-rules.mjs'
      - 'scripts/test-customization-rules.mjs'
      - 'scripts/test-account-authority-rules.mjs'
      - 'scripts/test-commerce-authority-rules.mjs'
      - 'scripts/test-dm-membership-authority.mjs'
      - 'functions/src/_shared/admin.ts'
      - 'functions/src/_shared/stripe*.ts'
      - 'functions/src/_shared/conversation*.ts'
      - 'functions/src/stripe.ts'
      - 'functions/src/spotify.ts'
      - 'functions/src/dmSend.ts'
      - 'functions/src/calls.ts'
      - 'functions/src/realtime.ts'
      - 'src/lib/dmMembershipRepair*'
      - 'src/hooks/useCreatorProfile*'
      - 'src/hooks/useCommunityVoice*'
      - 'src/hooks/useSharedThemes.ts'
      - 'src/hooks/useUserBackgrounds.ts'
      - 'src/hooks/useCustomTheme.ts'
      - 'src/hooks/useUISettings.ts'
      - 'functions/src/gameIntegration*.ts'
      - 'functions/src/gamePartner*.ts'
      - 'functions/src/_shared/gameCaptureCore.ts'
      - 'functions/src/_shared/gamePartner*.ts'
      - 'functions/src/captureEvents.ts'
      - 'src/lib/gameCapture*.ts'
      - 'src/lib/gameIntegration*.ts'
      - 'src/lib/gamePartner*.ts'
      - 'src/hooks/usePosts.ts'
      - 'src/pages/GameCapture*'
      - 'src/pages/ConnectGame*'
      - 'src/components/settings/GameConnectionsSection*'
      - 'src/pages/MiniApps*'
      - 'src/features/mini-apps/**'
      - 'sdk/game/**'
      - '.github/workflows/creator-platform-rules-qa.yml'

permissions:
  contents: read

concurrency:
  group: creator-platform-rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  creator-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-vybe-creators

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set isolated tools directory
        run: echo "FIREBASE_TEST_TOOLS_ROOT=$RUNNER_TEMP/vybe-creator-rules-tools" >> "$GITHUB_ENV"

      # Keep the emulator and its SDK outside the application dependency tree.
      # The scripts resolve this SDK through FIREBASE_TEST_TOOLS_ROOT.
      - name: Install isolated Firebase QA tools
        run: >-
          npm install --prefix "$FIREBASE_TEST_TOOLS_ROOT"
          --no-audit --no-fund --save-exact
          firebase-tools@15.28.2 @firebase/rules-unit-testing@5.0.2 firebase@12.19.0

      - name: Check test entry points
        run: |
          node --check scripts/test-creator-platform-rules.mjs
          node --check scripts/test-game-capture-post-rules.mjs
          node --check scripts/test-customization-rules.mjs
          node --check scripts/test-account-authority-rules.mjs
          node --check scripts/test-commerce-authority-rules.mjs
          node --check scripts/test-dm-membership-authority.mjs

      # Explicit demo project + QA-only config prevents the repository's
      # production default in .firebaserc from being selected.
      - name: Run creator and account authority rules against local emulators
        run: >-
          node "$FIREBASE_TEST_TOOLS_ROOT/node_modules/firebase-tools/lib/bin/firebase.js"
          emulators:exec --non-interactive
          --project "$GCLOUD_PROJECT" --config firebase.qa.json --only firestore,storage
          "node scripts/test-creator-platform-rules.mjs &&
          node scripts/test-game-capture-post-rules.mjs &&
          node scripts/test-customization-rules.mjs &&
          node scripts/test-account-authority-rules.mjs &&
          node scripts/test-commerce-authority-rules.mjs &&
          node scripts/test-dm-membership-authority.mjs"

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-platform-rules-diagnostics
          path: |
            firebase-debug.log
            firestore-debug.log
            storage-debug.log
          retention-days: 7
          if-no-files-found: ignore
