permissions:
  contents: read

concurrency:
  group: creator-platform-rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  creator-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-vybe-creators

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set isolated tools directory
        run: echo "FIREBASE_TEST_TOOLS_ROOT=$RUNNER_TEMP/vybe-creator-rules-tools" >> "$GITHUB_ENV"

      # Keep the emulator and its SDK outside the application dependency tree.
      # The scripts resolve this SDK through FIREBASE_TEST_TOOLS_ROOT.
      - name: Install isolated Firebase QA tools
        run: >-
          npm install --prefix "$FIREBASE_TEST_TOOLS_ROOT"
          --no-audit --no-fund --save-exact
          firebase-tools@15.28.2 @firebase/rules-unit-testing@5.0.2 firebase@12.19.0

      - name: Build isolated callable fixtures
        run: |
          npm ci --prefix functions
          npm run build --prefix functions

      - name: Check test entry points
        run: |
          node --check scripts/test-creator-platform-rules.mjs
          node --check scripts/test-game-capture-post-rules.mjs
          node --check scripts/test-customization-rules.mjs
          node --check scripts/test-custom-sound-rules.mjs
          node --check scripts/test-profile-visibility-rules.mjs
          node --check scripts/test-profile-audience-backend.mjs
          node --check scripts/test-community-attachments-rules.mjs
          node --check scripts/test-community-attachments-backend.mjs
          node --check scripts/test-story-publish-rules.mjs
          node --check scripts/test-story-publish-backend.mjs
          node --check scripts/test-account-authority-rules.mjs
          node --check scripts/test-commerce-authority-rules.mjs
          node --check scripts/test-dm-membership-authority.mjs
          node --check scripts/test-premium-authority-rules.mjs
          node --check scripts/test-reward-authority-rules.mjs
          node --check scripts/test-community-authority-rules.mjs
          node --check scripts/test-reward-authority-backend.mjs
          node --check scripts/test-premium-authority-backend.mjs
          node --check scripts/test-token-marketplace-rules.mjs
          node --check scripts/test-token-marketplace-backend.mjs
          node --check scripts/test-report-authority-rules.mjs
          node --check scripts/test-report-authority-backend.mjs
          node --check scripts/test-report-notification-backend.mjs
          node --check scripts/test-message-report-backend.mjs
          node --check scripts/test-feed-mute-rules.mjs

      # Explicit demo project + QA-only config prevents the repository's
      # production default in .firebaserc from being selected.
      - name: Run creator and account authority rules against local emulators
        run: >-
          node "$FIREBASE_TEST_TOOLS_ROOT/node_modules/firebase-tools/lib/bin/firebase.js"
          emulators:exec --non-interactive
          --project "$GCLOUD_PROJECT" --config firebase.qa.json --only firestore,storage
          "node scripts/test-creator-platform-rules.mjs &&
          node scripts/test-game-capture-post-rules.mjs &&
          node scripts/test-customization-rules.mjs &&
          node scripts/test-custom-sound-rules.mjs &&
          node scripts/test-profile-visibility-rules.mjs &&
          node scripts/test-profile-audience-backend.mjs &&
          node scripts/test-community-attachments-rules.mjs &&
          node scripts/test-community-attachments-backend.mjs &&
          node scripts/test-story-publish-rules.mjs &&
          node scripts/test-story-publish-backend.mjs &&
          node scripts/test-account-authority-rules.mjs &&
          node scripts/test-commerce-authority-rules.mjs &&
          node scripts/test-dm-membership-authority.mjs &&
          node scripts/test-premium-authority-rules.mjs &&
          node scripts/test-reward-authority-rules.mjs &&
          node scripts/test-community-authority-rules.mjs &&
          node scripts/test-report-authority-rules.mjs &&
          node scripts/test-reward-authority-backend.mjs &&
          node scripts/test-premium-authority-backend.mjs &&
          node scripts/test-token-marketplace-rules.mjs &&
          node scripts/test-token-marketplace-backend.mjs &&
          node scripts/test-report-authority-backend.mjs &&
          node scripts/test-message-report-backend.mjs &&
          node scripts/test-feed-mute-rules.mjs &&
          node scripts/test-report-notification-backend.mjs"

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-platform-rules-diagnostics
          path: |
            firebase-debug.log
            firestore-debug.log
            storage-debug.log
          retention-days: 7
          if-no-files-found: ignore
