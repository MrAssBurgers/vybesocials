name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          npm ci --prefix functions

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Type check standalone game SDKs
        run: npm run typecheck:game-sdk

      - name: Build universal integration SDK and check example server
        run: |
          npm run build --prefix sdk
          node sdk/examples/file-picker/check.mjs

      - name: Build Cloud Functions
        run: npm --prefix functions run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify and package native .NET integration
        run: |
          dotnet run --project sdk/dotnet/Vybe.Integration.Checks -c Release
          dotnet pack sdk/dotnet/Vybe.Integration/Vybe.Integration.csproj -c Release -o work/dotnet-package
          dotnet build sdk/examples/godot/VybeGodot.csproj -c Debug

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate CSS
        run: npm run validate:css

      - name: Validate boot output
        run: npm run validate:boot

      - name: Check bundle budget
        run: npm run check:bundle-budget

      - name: Verify callable-only DM enforcement
        run: npm run test:dm-send-enforcement

      - name: Verify DM inbox rules contract
        run: npm run test:dm-inbox-rules

      - name: Verify camera send enforcement
        run: npm run test:camera-send-enforcement
