name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate CSS
        run: npm run validate:css

      - name: Validate boot output
        run: npm run validate:boot

      - name: Check bundle budget
        run: npm run check:bundle-budget

      - name: Verify callable-only DM enforcement
        run: npm run test:dm-send-enforcement

      - name: Verify DM inbox rules contract
        run: npm run test:dm-inbox-rules

      - name: Verify camera send enforcement
        run: npm run test:camera-send-enforcement
